[package]
name = "amatl-embedding-relevance-experiment"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"
description = "STEP 4A: local embedding relevance feasibility experiment (NOT production code)"

# This crate is intentionally OUTSIDE the amatl workspace (see root Cargo.toml
# `exclude`). It carries heavy ML dependencies and a model download at
# development time only. Nothing here is wired into amatl-core relevance.

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[dependencies.fastembed]
version = "6"
default-features = false
# `ort-download-binaries` fetches a prebuilt ONNX Runtime at build time (dev
# machine only). `hf-hub` pulls the model once into the HF cache.
features = ["ort-download-binaries", "hf-hub"]

[dev-dependencies]

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[[bin]]
name = "diagnostic"
path = "src/bin/diagnostic.rs"

[profile.release]
debug = false
