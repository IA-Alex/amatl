# SearXNG settings for AMATL's `searxng` provider.
#
# AMATL calls: GET /search?q=<query>&format=json&pageno=1
#
# The stock `searxng/searxng` image ships with `format: json` DISABLED. Without
# `search.formats` listing `json` below, the instance answers the adapter's
# request with HTTP 403 and AMATL reports `provider_invalid_response`. That is
# the single most common reason the source looks "broken" against a fresh
# instance.
use_default_settings: true

server:
  # Bind inside the container on every interface so the published port works.
  bind_address: "0.0.0.0"
  port: 8080
  # REPLACE before exposing the instance beyond loopback. SearXNG refuses to
  # start with the default placeholder; this is a known local value.
  secret_key: "amatl-local-searxng-change-me"
  # The rate limiter blocks automated (non-browser) callers, which is exactly
  # what the AMATL adapter is. Keep it off for a private, loopback instance.
  limiter: false
  public_instance: false

search:
  # Enable the JSON output format the adapter depends on.
  formats:
    - html
    - json

# Reduce upstream blocking/CAPTCHA. AMATL sends neither `engines` nor
# `categories`, so these are the engines a general query reaches. Engines that
# routinely block automated traffic stay disabled, matching the operator
# guidance in docs/gobernanza-providers.md ("configure only permissive
# engines").
engines:
  - name: duckduckgo
    disabled: false
  - name: wikipedia
    disabled: false
  - name: wikidata
    disabled: false
  - name: brave
    disabled: false
  - name: google
    disabled: true
  - name: bing
    disabled: true
  - name: startpage
    disabled: true
  - name: qwant
    disabled: true
