[advisories]
version = 2
yanked = "warn"
# Exactly one advisory is suppressed, by ID, and the reason lives in three
# places a reviewer can check: `ADR-017` (`decisiones_amatl.md`) owns the exit
# plan, `docs/security/supply-chain.md` states the threat model, and
# `scripts/security-gate.sh` re-derives this list on every CI run so the
# suppression cannot grow without being seen. RUSTSEC-2026-0459
# (`libsqlite3-sys` via C SQLite, patched in `>=0.39.0`) is reachable by no
# released `sqlx`; every other advisory must keep failing the gate.
ignore = ["RUSTSEC-2026-0459"]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
