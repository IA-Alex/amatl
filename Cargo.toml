[workspace]
members = ["crates/amatl-core", "crates/amatl-cli", "crates/amatl-ui", "crates/amatl-server"]
# STEP 4A local-embedding feasibility experiment. Standalone crate with its own
# lockfile and heavy ML dependencies (fastembed/ort). Deliberately excluded from
# the workspace so `cargo {check,clippy,test} --workspace` and production builds
# never see it. See experiments/embedding-relevance/README.md.
#
# STEP 4D local-embedding integration boundary. Same treatment for the same
# reason, plus one more: its Candle stack (`candle-core 0.9.2` -> `zip ^7.2.0`)
# carries RUSTSEC-2026-0367/-0368/-0369, patched only from `zip 9.0.0`, which no
# candle release reaches. Keeping the stack in this excluded crate with its own
# lockfile is what closes that finding without a waiver: the workspace
# `Cargo.lock` — and therefore `cargo audit` — no longer contains it. See
# experiments/local-embeddings-boundary/README.md and
# docs/security/supply-chain.md.
exclude = [
    "experiments/embedding-relevance",
    "experiments/local-embeddings-boundary",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
version = "0.1.0-rc.1"
repository = "https://github.com/IA-Alex/amatl"
homepage = "https://github.com/IA-Alex/amatl"
documentation = "https://github.com/IA-Alex/amatl"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8.9"
axum-server = { version = "0.8.0", features = ["tls-rustls-no-provider"] }
clap = { version = "4", features = ["derive"] }
http = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
nom = "7"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
scraper = "0.27"
rmcp = { version = "3.1.2", features = ["server", "transport-streamable-http-server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "sqlite"] }
# RUSTSEC-2026-0459 (`libsqlite3-sys` via C SQLite, patched in `>=0.39.0`) is the
# one advisory no released `sqlx` can reach: 0.8.6 caps the crate at `^0.30` and
# even 0.9.0 caps it below the fix. `cargo audit` and `cargo deny check` scan the
# whole lockfile and cannot be told to fail on everything else, so without an
# `ignore` entry the gate stays red for every future advisory and a fixed `404`
# in CI carries no signal about the rest of the graph. The suppression is
# therefore scoped to that single ID and justified: `ADR-017` in
# `decisiones_amatl.md` owns the exit plan, `docs/security/supply-chain.md`
# carries the threat model, and the gate script below keeps the omission visible
# by reporting the suppressed IDs on every run.
#
# Pinning both tools to exact, reviewed versions is the guard that the red gate
# was standing in for: an advisory database that reads an `ignore` differently,
# or a checker that folds it into a different config section, would silently
# stop reporting. Bumping either version is a reviewed change, not a refresh.
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
tokio-util = { version = "0.7", default-features = false }
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.8"
toml_edit = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tower = { version = "0.5", features = ["limit", "timeout", "util"] }
tower-http = { version = "0.7.0", features = ["cors", "limit", "timeout"] }
url = { version = "2", features = ["serde"] }
unicode-normalization = "0.1"
fs2 = "0.4"
zeroize = "1"

[workspace.metadata.release]
primary-target = "x86_64-unknown-linux-musl"
archive = "amatl-{version}-x86_64-unknown-linux-musl.tar.gz"

[workspace.lints.rust]
unsafe_code = "forbid"
