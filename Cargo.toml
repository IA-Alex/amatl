[workspace]
members = ["crates/amatl-core", "crates/amatl-cli", "crates/amatl-ui", "crates/amatl-server"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
version = "0.1.0-rc.1"
repository = "https://github.com/IA-Alex/amatl"
homepage = "https://github.com/IA-Alex/amatl"
documentation = "https://github.com/IA-Alex/amatl"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8.9"
axum-server = { version = "0.8.0", features = ["tls-rustls-no-provider"] }
clap = { version = "4", features = ["derive"] }
http = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
scraper = "0.27"
rmcp = { version = "3.1.2", features = ["server", "transport-streamable-http-server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
tokio-util = { version = "0.7", default-features = false }
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tower = { version = "0.5", features = ["limit", "timeout", "util"] }
tower-http = { version = "0.7.0", features = ["cors", "limit", "timeout"] }
url = { version = "2", features = ["serde"] }
unicode-normalization = "0.1"
fs2 = "0.4"

[workspace.metadata.release]
primary-target = "x86_64-unknown-linux-musl"
archive = "amatl-{version}-x86_64-unknown-linux-musl.tar.gz"

[workspace.lints.rust]
unsafe_code = "forbid"
