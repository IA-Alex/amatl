        '503': { $ref: '#/components/responses/StorageUnavailable' }
        '504': { $ref: '#/components/responses/RequestTimeout' }
components:
  headers:
    RequestId:
      description: Opaque correlation identifier generated independently for this request
      schema:
        type: string
        pattern: '^[0-9a-f]{32}-[0-9a-f]{16}$'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        Local bearer token of at least 32 bytes. Each configured credential has
        its own scopes (search, deep, read, write, admin, mcp) and optional
        expiry; a valid token without the route's scope receives 403
        `scope_denied`.
  parameters:
    Query:
      name: q
      in: query
      required: true
      description: AMATL query text, including supported operators
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum entries to return; clamped to 200
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Offset:
      name: offset
      in: query
      required: false
      schema: { type: integer, minimum: 0, default: 0 }
    EntryId:
      name: id
      in: path
      required: true
      schema: { type: integer }
    ProviderName:
      name: name
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    PolicyName:
      name: name
      in: path
      required: true
      description: One of ranking, diversity, search, ranking_v2, or gaps.
      schema: { type: string, enum: [ranking, diversity, search, ranking_v2, gaps] }
    ClientId:
      name: id
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Makes a retry of this call safe. The first accepted request carrying a
        given value performs the write; a later request with the same value
        replays that result instead of writing a second backup, and a request
        that arrives while the first is still running waits for it. Accepted
        values are 1 to 128 visible ASCII characters; anything else is rejected
        as invalid_request.
      schema: { type: string, minLength: 1, maxLength: 128 }
  requestBodies:
    ToggleEnabled:
      required: true
      description: Feature flag toggle.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ToggleInput' }
    ProviderToggleEnabled:
      required: true
      description: Provider enable/disable toggle.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ProviderToggleInput' }
    ProviderCredential:
      required: true
      description: Provider credential, canary-validated and kept in memory only.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ProviderCredentialInput' }
    ProviderRecord:
      required: true
      description: Partial provider governance record.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ProviderRecordInput' }
    InferencePatch:
      required: true
      description: Partial inference settings.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/InferencePatch' }
    AnswerPatch:
      required: true
      description: Partial answer-synthesis settings.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AnswerPatch' }
    DataPolicyPatch:
      required: true
      description: Partial data-policy settings.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/DataPolicyPatch' }
    PolicyPatch:
      required: true
      description: Complete policy object for the addressed policy name.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PolicyPatch' }
    PersistencePatch:
      required: true
      description: Partial persistence settings.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PersistencePatch' }
    TelemetryPatch:
      required: true
      description: Partial telemetry settings.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TelemetryPatch' }
    DeepPatch:
      required: true
      description: Partial Deep limits.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/DeepPatch' }
    ExtractorPatch:
      required: true
      description: Partial extractor settings.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ExtractorPatch' }
    RendererPatch:
      required: true
      description: Partial renderer settings.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RendererPatch' }
    ServerClientCreate:
      required: true
      description: New server client definition.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ServerClientCreateInput' }
    ServerClientUpdate:
      required: true
      description: Partial server client update.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ServerClientUpdateInput' }
    ServerPendingConfigPatch:
      required: true
      description: Partial server configuration.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ServerPendingConfigPatch' }
  responses:
    ReloadReport:
      description: Configuration change applied (or rejected as a whole) without a restart.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ReloadReport' }
    ProviderCredentialReport:
      description: Credential state after insert, replace or delete.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ProviderCredentialReport' }
    ProviderRecord:
      description: Current provider governance record.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ProviderRecordReport' }
    ServerClientList:
      description: Configured server clients without credentials.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ServerClientList' }
    ServerClientRecord:
      description: The updated server client, without its credential.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ServerClientRecord' }
    CreatedServerClient:
      description: The created or rotated client with its one-time plaintext token.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CreatedServerClient' }
    ServerPendingConfigReport:
      description: Result of writing the pending server configuration.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ServerPendingConfigReport' }
    ServerConfigReport:
      description: Effective server configuration, without clients.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ServerConfigReport' }
    PersistenceConfigReport:
      description: Effective persistence configuration.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PersistenceConfigReport' }
    BackupList:
      description: Known backup files, newest first.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/BackupList' }
    BackupCreated:
      description: Path of the backup just written.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/BackupCreated' }
    CircuitList:
      description: Provider circuit breaker states.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CircuitList' }
    TelemetryConfigReport:
      description: Effective telemetry configuration.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TelemetryConfigReport' }
    DeepConfigReport:
      description: Effective Deep configuration.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/DeepConfigReport' }
    PoliciesReport:
      description: Effective policies for every human-readable name.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PoliciesReport' }
    ReadyReport:
      description: Process readiness and local-state availability.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ReadyReport' }
    Conflict:
      description: Resource already exists or cannot be changed in its current state
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    BadRequest:
      description: >-
        Invalid request shape: unusable query text or malformed JSON, or a
        `Host` header absent from or outside the configured allow list
        (`invalid_host`)
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Missing or invalid bearer token
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
        WWW-Authenticate:
          schema: { type: string, const: Bearer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: >-
        Origin is not allowed (`invalid_origin`), or the credential lacks the
        capability the route requires (`scope_denied`)
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    BodyTooLarge:
      description: Request body exceeds the configured maximum (default 65536 bytes)
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    HeadersTooLarge:
      description: Aggregate request headers exceed the configured maximum (default 16384 bytes)
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RateLimited:
      description: Per-process socket-IP rate limit exceeded
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
        Retry-After:
          schema: { type: string, const: '60' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: The addressed entry does not exist
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    StorageUnavailable:
      description: Local persistence is disabled or unusable
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ServiceUnavailable:
      description: Planning or service configuration failure
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RequestTimeout:
      description: Configured request deadline expired (default 30000 ms)
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    SchemaVersion:
      type: string
      const: '1'
    # ── Administrative request bodies ────────────────────────────────────────
    # Field names and types mirror the Rust patch structs (snake_case, no
    # renames except `local_cache_capacity`). Every field is optional: an
    # omitted field retains its current value, and an empty string clears an
    # optional string field (see lib.rs empty-string-clears convention).
    ToggleInput:
      type: object
      additionalProperties: false
      required: [enabled]
      description: Flip a boolean feature flag and apply it live.
      properties:
        enabled: { type: boolean }
    ProviderToggleInput:
      type: object
      additionalProperties: false
      required: [enabled]
      description: Enable or disable a declared provider and reload it.
      properties:
        enabled: { type: boolean }
    ProviderCredentialInput:
      type: object
      additionalProperties: false
      required: [key]
      description: >-
        Insert or replace a provider credential in memory only. The key is used
        for a live canary and never written to disk.
      properties:
        key:
          type: string
          minLength: 1
          description: Provider credential value; zeroized server-side.
    ProviderRecordInput:
      type: object
      additionalProperties: false
      description: >-
        Partial provider governance record. Omitted fields are unchanged; an
        empty string clears an optional string field.
      properties:
        adapter_version: { type: [string, 'null'] }
        approval_status: { $ref: '#/components/schemas/ApprovalStatus' }
        reviewed_at: { type: [string, 'null'] }
        reviewer: { type: [string, 'null'] }
        terms_url: { type: [string, 'null'] }
        terms_version_or_date: { type: [string, 'null'] }
        allowed_access_method: { type: [string, 'null'] }
        plan_or_contract: { type: [string, 'null'] }
        rate_limit: { type: [string, 'null'] }
        cost_model: { type: [string, 'null'] }
        credential_env: { type: [string, 'null'] }
        storage_rights: { type: [boolean, 'null'] }
        supported_regions: { type: [array, 'null'], items: { type: string } }
        supported_filters: { type: [array, 'null'], items: { type: string } }
        data_handling_notes: { type: [string, 'null'] }
        operational_risk: { type: [string, 'null'] }
    InferencePatch:
      type: object
      additionalProperties: false
      description: Partial inference settings; omitted fields are unchanged.
      properties:
        backend: { type: [string, 'null'] }
        embedding_dimensions: { type: [integer, 'null'], minimum: 0 }
        max_documents: { type: [integer, 'null'], minimum: 0 }
        max_input_chars: { type: [integer, 'null'], minimum: 0 }
        reranker_prior_weight: { type: [number, 'null'] }
        local_model_path: { type: [string, 'null'] }
        local_cache_capacity:
          type: [integer, 'null']
          minimum: 0
          description: Also accepted under the alias `local_model_batch`.
        local_cache_path: { type: [string, 'null'] }
        remote_endpoint: { type: [string, 'null'] }
        remote_model: { type: [string, 'null'] }
        remote_credential_env: { type: [string, 'null'] }
        remote_timeout_ms: { type: [integer, 'null'], minimum: 0 }
        remote_max_batch: { type: [integer, 'null'], minimum: 0 }
    DataPolicyPatch:
      type: object
      additionalProperties: false
      description: Partial data-policy settings; omitted fields are unchanged.
      properties:
        profile: { $ref: '#/components/schemas/SecurityProfile' }
        egress: { $ref: '#/components/schemas/EgressPolicy' }
        inference: { $ref: '#/components/schemas/InferenceMode' }
    PolicyPatch:
      type: object
      additionalProperties: true
      description: >-
        A complete policy object, validated against the policy type selected by
        `{name}` (ranking, diversity, search, ranking_v2 or gaps). The concrete
        shape is versioned per policy; an unknown name is `not_found`.
    PersistencePatch:
      type: object
      additionalProperties: false
      description: >-
        Partial persistence settings; omitted fields are unchanged. `enabled`,
        `path` and `locking_mode` are not mutable through this surface.
      properties:
        history_enabled: { type: [boolean, 'null'] }
        saved_document_max_bytes: { type: [integer, 'null'], minimum: 0 }
        saved_documents_retention_days: { type: [integer, 'null'], minimum: 0 }
        audit_retention_days: { type: [integer, 'null'], minimum: 0 }
        history_retention_days: { type: [integer, 'null'], minimum: 0 }
        cache_retention_days: { type: [integer, 'null'], minimum: 0 }
        document_cache_retention_days: { type: [integer, 'null'], minimum: 0 }
        purge_interval_seconds: { type: [integer, 'null'], minimum: 0 }
        auto_backup_enabled: { type: [boolean, 'null'] }
        auto_backup_interval_seconds: { type: [integer, 'null'], minimum: 0 }
        auto_backup_max_count: { type: [integer, 'null'], minimum: 0 }
        backup_directory: { type: [string, 'null'] }
    TelemetryPatch:
      type: object
      additionalProperties: false
      description: Partial telemetry settings; omitted fields are unchanged.
      properties:
        persistence_enabled: { type: [boolean, 'null'] }
        retention_days: { type: [integer, 'null'], minimum: 0 }
    DeepPatch:
      type: object
      additionalProperties: false
      description: Partial Deep limits; omitted fields are unchanged.
      properties:
        top_k: { type: [integer, 'null'], minimum: 0 }
        max_fetches: { type: [integer, 'null'], minimum: 0 }
        max_bytes: { type: [integer, 'null'], minimum: 0 }
        max_redirects: { type: [integer, 'null'], minimum: 0 }
        max_crawl_urls: { type: [integer, 'null'], minimum: 0 }
        max_depth: { type: [integer, 'null'], minimum: 0 }
        respect_robots: { type: [boolean, 'null'] }
        robots_timeout_ms: { type: [integer, 'null'], minimum: 0 }
        robots_max_bytes: { type: [integer, 'null'], minimum: 0 }
        timeout_ms: { type: [integer, 'null'], minimum: 0 }
    ExtractorPatch:
      type: object
      additionalProperties: false
      description: Partial extractor settings; omitted fields are unchanged.
      properties:
        executable: { type: [string, 'null'] }
        version: { type: [string, 'null'] }
        timeout_ms: { type: [integer, 'null'], minimum: 0 }
        max_output_bytes: { type: [integer, 'null'], minimum: 0 }
    RendererPatch:
      type: object
      additionalProperties: false
      description: Partial renderer settings; omitted fields are unchanged.
      properties:
        enabled: { type: [boolean, 'null'] }
        max_browser_calls: { type: [integer, 'null'], minimum: 0 }
        timeout_ms: { type: [integer, 'null'], minimum: 0 }
        shutdown_grace_ms: { type: [integer, 'null'], minimum: 0 }
        max_memory_mb: { type: [integer, 'null'], minimum: 0 }
        max_redirects: { type: [integer, 'null'], minimum: 0 }
        sandbox_path: { type: [string, 'null'] }
        max_dom_bytes: { type: [integer, 'null'], minimum: 0 }
    AnswerPatch:
      type: object
      additionalProperties: false
      description: >-
        Partial answer-synthesis settings; omitted fields are unchanged.
        `enabled` is not mutable here — use POST /answer/enabled.
      properties:
        endpoint: { type: [string, 'null'] }
        model: { type: [string, 'null'] }
        credential_env: { type: [string, 'null'] }
        timeout_ms: { type: [integer, 'null'], minimum: 0 }
        max_sources: { type: [integer, 'null'], minimum: 0 }
        max_source_chars: { type: [integer, 'null'], minimum: 0 }
        max_answer_tokens: { type: [integer, 'null'], minimum: 0 }
    ServerClientCreateInput:
      type: object
      additionalProperties: false
      required: [id, scopes]
      properties:
        id: { type: string, minLength: 1 }
        scopes:
          type: array
          items: { $ref: '#/components/schemas/Scope' }
        tools:
          type: array
          items: { type: string }
          default: []
        expires_at: { type: [string, 'null'] }
    ServerClientUpdateInput:
      type: object
      additionalProperties: false
      description: >-
        Omitted fields are unchanged. For `expires_at`, absent means unchanged
        and an explicit `null` clears the expiry.
      properties:
        scopes:
          type: [array, 'null']
          items: { $ref: '#/components/schemas/Scope' }
        tools:
          type: [array, 'null']
          items: { type: string }
        expires_at: { type: [string, 'null'] }
    ServerPendingConfigPatch:
      type: object
      additionalProperties: false
      description: >-
        Partial server configuration; omitted fields are unchanged. A write may
        require a restart (see `requires_restart` in the response).
      properties:
        bind: { type: [string, 'null'] }
        port: { type: [integer, 'null'], minimum: 0, maximum: 65535 }
        token_env: { type: [string, 'null'] }
        no_auth: { type: [boolean, 'null'] }
        allowed_hosts: { type: [array, 'null'], items: { type: string } }
        allowed_origins: { type: [array, 'null'], items: { type: string } }
        max_body_bytes: { type: [integer, 'null'], minimum: 0 }
        max_header_bytes: { type: [integer, 'null'], minimum: 0 }
        request_timeout_ms: { type: [integer, 'null'], minimum: 0 }
        idle_timeout_ms: { type: [integer, 'null'], minimum: 0 }
        rate_limit_per_minute: { type: [integer, 'null'], minimum: 0 }
        max_connections: { type: [integer, 'null'], minimum: 0 }
        tls_cert_path: { type: [string, 'null'] }
        tls_key_path: { type: [string, 'null'] }
    # ── Enums shared by request bodies ───────────────────────────────────────
    ApprovalStatus:
      type: string
      enum: [draft, approved, expired, rejected]
    SecurityProfile:
      type: string
      enum: [standard, isolated]
    EgressPolicy:
      type: string
      enum: [deny, governed]
    InferenceMode:
      type: string
      enum: [disabled, local_only, remote_explicit]
    Scope:
      type: string
      enum: [search, deep, read, write, admin, mcp]
    SqliteLockingMode:
      type: string
      enum: [normal, exclusive]
    # ── Administrative response bodies ───────────────────────────────────────
    ProviderCredentialReport:
      type: object
      additionalProperties: false
      required: [schema_version, name, set, available]
      properties:
        schema_version: { $ref: '#/components/schemas/SchemaVersion' }
        name: { type: string }
        set: { type: boolean }
        available: { type: boolean }
    ProviderRecordReport:
      type: object
      additionalProperties: false
      required: [schema_version, name, record, approved]
      properties:
        schema_version: { $ref: '#/components/schemas/SchemaVersion' }
        name: { type: string }
        record: { $ref: '#/components/schemas/ProviderRuntimeConfig' }
        approved: { type: boolean }
    ProviderRuntimeConfig:
      type: object
      additionalProperties: false
      required: [adapter_version, approval_status, reviewed_at, reviewer, terms_url, terms_version_or_date, allowed_access_method, plan_or_contract, rate_limit, cost_model, credential_env, storage_rights, supported_regions, supported_filters, data_handling_notes, operational_risk]
      properties:
        adapter_version: { type: [string, 'null'] }
        approval_status: { $ref: '#/components/schemas/ApprovalStatus' }
        reviewed_at: { type: [string, 'null'] }
        reviewer: { type: [string, 'null'] }
        terms_url: { type: [string, 'null'] }
        terms_version_or_date: { type: [string, 'null'] }
        allowed_access_method: { type: [string, 'null'] }
        plan_or_contract: { type: [string, 'null'] }
        rate_limit: { type: [string, 'null'] }
        cost_model: { type: [string, 'null'] }
        credential_env: { type: [string, 'null'] }
        storage_rights: { type: boolean }
        supported_regions: { type: array, items: { type: string } }
        supported_filters: { type: array, items: { type: string } }
        data_handling_notes: { type: [string, 'null'] }
        operational_risk: { type: [string, 'null'] }
    ServerClientSummary:
      type: object
      additionalProperties: false
      required: [id, scopes, tools, expires_at, credential_kind]
      properties:
        id: { type: string }
        scopes: { type: array, items: { $ref: '#/components/schemas/Scope' } }
        tools: { type: array, items: { type: string } }
        expires_at: { type: [string, 'null'] }
        credential_kind: { type: string, enum: [token_env, token_sha256] }
    ServerClientList:
      type: object
      additionalProperties: false
      required: [schema_version, clients]
      properties:
        schema_version: { $ref: '#/components/schemas/SchemaVersion' }
        clients: { type: array, items: { $ref: '#/components/schemas/ServerClientSummary' } }
    ServerClientRecord:
      type: object
      additionalProperties: false
      required: [schema_version, client]
      properties:
        schema_version: { $ref: '#/components/schemas/SchemaVersion' }
        client: { $ref: '#/components/schemas/ServerClientSummary' }
    CreatedServerClient:
      type: object
      additionalProperties: false
      required: [schema_version, id, scopes, tools, expires_at, credential_kind, token]
      description: A client summary plus the plaintext token, shown exactly once.
      properties:
        schema_version: { $ref: '#/components/schemas/SchemaVersion' }
        id: { type: string }
        scopes: { type: array, items: { $ref: '#/components/schemas/Scope' } }
        tools: { type: array, items: { type: string } }
        expires_at: { type: [string, 'null'] }
        credential_kind: { type: string, enum: [token_env, token_sha256] }
        token:
          type: string
          description: Plaintext bearer token; never retrievable again.
    ServerPendingConfigReport:
      type: object
      additionalProperties: false
      required: [schema_version, written, applied, requires_restart, hot_fields, cold_fields]
      properties:
        schema_version: { $ref: '#/components/schemas/SchemaVersion' }
        written: { type: array, items: { type: string } }
        applied: { type: boolean }
        requires_restart: { type: boolean }
        hot_fields: { type: array, items: { type: string } }
        cold_fields: { type: array, items: { type: string } }
    ServerConfigReport:
      type: object
      additionalProperties: false
      required: [schema_version, server]
      properties:
        schema_version: { $ref: '#/components/schemas/SchemaVersion' }
        server: { $ref: '#/components/schemas/ServerConfigView' }
    ServerConfigView:
      type: object
      additionalProperties: false
      required: [bind, port, token_env, no_auth, allowed_hosts, allowed_origins, max_body_bytes, max_header_bytes, request_timeout_ms, idle_timeout_ms, rate_limit_per_minute, max_connections, tls]
      properties:
        bind: { type: string }
        port: { type: integer }
        token_env: { type: string }
        no_auth: { type: boolean }
        allowed_hosts: { type: array, items: { type: string } }
        allowed_origins: { type: array, items: { type: string } }
        max_body_bytes: { type: integer }
        max_header_bytes: { type: integer }
        request_timeout_ms: { type: integer }
        idle_timeout_ms: { type: integer }
        rate_limit_per_minute: { type: integer }
        max_connections: { type: integer }
        tls:
          type: object
          additionalProperties: false
          required: [cert_path, key_path]
          properties:
            cert_path: { type: [string, 'null'] }
            key_path: { type: [string, 'null'] }
    PersistenceConfigReport:
      type: object
      additionalProperties: false
      required: [schema_version, persistence]
      properties:
        schema_version: { $ref: '#/components/schemas/SchemaVersion' }
        persistence: { $ref: '#/components/schemas/PersistenceConfigView' }
    PersistenceConfigView:
      type: object
      additionalProperties: false
      required: [enabled, path, history_enabled, saved_document_max_bytes, saved_documents_retention_days, audit_retention_days, history_retention_days, cache_retention_days, document_cache_retention_days, purge_interval_seconds, auto_backup_enabled, auto_backup_interval_seconds, auto_backup_max_count, backup_directory, locking_mode]
      properties:
        enabled: { type: boolean }
        path: { type: string }
        history_enabled: { type: boolean }
        saved_document_max_bytes: { type: integer }
        saved_documents_retention_days: { type: integer }
        audit_retention_days: { type: integer }
        history_retention_days: { type: integer }
        cache_retention_days: { type: integer }
        document_cache_retention_days: { type: integer }
        purge_interval_seconds: { type: integer }
        auto_backup_enabled: { type: boolean }
        auto_backup_interval_seconds: { type: integer }
        auto_backup_max_count: { type: integer }
        backup_directory: { type: [string, 'null'] }
        locking_mode: { $ref: '#/components/schemas/SqliteLockingMode' }
    BackupList:
      type: object
      additionalProperties: false
      required: [schema_version, backups]
      properties:
        schema_version: { $ref: '#/components/schemas/SchemaVersion' }
        backups: { type: array, items: { type: string } }
    BackupCreated:
      type: object
      additionalProperties: false
      required: [schema_version, path]
      properties:
        schema_version: { $ref: '#/components/schemas/SchemaVersion' }
        path: { type: string }
    CircuitList:
      type: object
      additionalProperties: false
      required: [schema_version, circuits]
      properties:
        schema_version: { $ref: '#/components/schemas/SchemaVersion' }
        circuits: { type: array, items: { $ref: '#/components/schemas/CircuitSnapshot' } }
    CircuitSnapshot:
      type: object
      additionalProperties: false
      required: [provider, state, consecutive_failures, open_until]
      properties:
        provider: { type: string }
        state: { $ref: '#/components/schemas/CircuitState' }
        consecutive_failures: { type: integer }
        open_until: { type: [integer, 'null'] }
    TelemetryConfigReport:
      type: object
      additionalProperties: false
      required: [schema_version, telemetry]
      properties:
        schema_version: { $ref: '#/components/schemas/SchemaVersion' }
        telemetry: { $ref: '#/components/schemas/TelemetryConfigView' }
    TelemetryConfigView:
      type: object
      additionalProperties: false
      required: [persistence_enabled, retention_days]
      properties:
        persistence_enabled: { type: boolean }
        retention_days: { type: integer }
    DeepConfigReport:
      type: object
      additionalProperties: false
      required: [schema_version, deep]
      properties:
        schema_version: { $ref: '#/components/schemas/SchemaVersion' }
        deep: { $ref: '#/components/schemas/DeepConfigView' }
    DeepConfigView:
      type: object
      additionalProperties: false
      required: [top_k, max_fetches, max_bytes, max_redirects, max_crawl_urls, max_depth, respect_robots, robots_timeout_ms, robots_max_bytes, timeout_ms, extractor, renderer, ranking_v2, gaps]
      properties:
        top_k: { type: integer }
        max_fetches: { type: integer }
        max_bytes: { type: integer }
        max_redirects: { type: integer }
        max_crawl_urls: { type: integer }
        max_depth: { type: integer }
        respect_robots: { type: boolean }
        robots_timeout_ms: { type: integer }
        robots_max_bytes: { type: integer }
        timeout_ms: { type: integer }
        extractor: { $ref: '#/components/schemas/ExtractorConfigView' }
        renderer: { $ref: '#/components/schemas/RendererConfigView' }
        ranking_v2: { type: object, additionalProperties: true, description: Versioned Ranking v2 configuration. }
        gaps: { type: object, additionalProperties: true, description: Versioned gap-analysis configuration. }
    ExtractorConfigView:
      type: object
      additionalProperties: false
      required: [executable, version, timeout_ms, max_output_bytes]
      properties:
        executable: { type: [string, 'null'] }
        version: { type: [string, 'null'] }
        timeout_ms: { type: integer }
        max_output_bytes: { type: integer }
    RendererConfigView:
      type: object
      additionalProperties: false
      required: [enabled, max_browser_calls, timeout_ms, shutdown_grace_ms, max_memory_mb, max_redirects, sandbox_path, max_dom_bytes]
      properties:
        enabled: { type: boolean }
        max_browser_calls: { type: integer }
        timeout_ms: { type: integer }
        shutdown_grace_ms: { type: integer }
        max_memory_mb: { type: integer }
        max_redirects: { type: integer }
        sandbox_path: { type: [string, 'null'] }
        max_dom_bytes: { type: integer }
    PoliciesReport:
      type: object
      additionalProperties: false
      required: [schema_version, ranking_policy, diversity_policy, search_policy, ranking_v2_policy, gap_policy]
      properties:
        schema_version: { $ref: '#/components/schemas/SchemaVersion' }
        ranking_policy: { type: object, additionalProperties: true }
        diversity_policy: { type: object, additionalProperties: true }
        search_policy: { type: object, additionalProperties: true }
        ranking_v2_policy: { type: object, additionalProperties: true }
        gap_policy: { type: object, additionalProperties: true }
    ReadyReport:
      type: object
      additionalProperties: false
      required: [schema_version, status, storage_ok, sources_available, sources_usable]
      description: >-
        Liveness/readiness probe payload. `sources_usable` counts available
        sources whose circuit breaker is not open.
      properties:
        schema_version: { $ref: '#/components/schemas/SchemaVersion' }
        status: { type: string, enum: [ok, degraded] }
        storage_ok: { type: boolean }
        sources_available: { type: integer }
        sources_usable: { type: integer }
    QueryInput:
      type: object
      required: [q]
      properties:
        q:
          type: string
          minLength: 1
          maxLength: 2048
        page:
          type: integer
          minimum: 0
          description: >-
            Zero-based page index. A single pagination-capable provider receives
            native pagination; otherwise AMATL slices the merged ranked results.
            If either bound is omitted, page defaults to zero and page_size to the
            surface maximum. `total_results` may be absent when a native provider
            cannot determine it from the response. The client must not window the array again. Ignored by /deep.
        page_size:
          type: integer
          minimum: 1
          maximum: 100
    SearchBatchResponse:
      type: object
      required: [schema_version, count, batches]
      properties:
        schema_version: { $ref: '#/components/schemas/SchemaVersion' }
        count:
          type: integer
          description: Number of batch items, matching the number of submitted queries.
        batches:
          type: array
          description: One outcome per submitted query, in caller order.
          items: { $ref: '#/components/schemas/SearchBatchItem' }
    SearchBatchItem:
      type: object
      required: [query]
      properties:
        query:
          type: string
          description: The submitted query this item reports on.
        response:
          allOf: [{ $ref: '#/components/schemas/SearchResponse' }]
          description: Present when the query executed; mutually exclusive with `error`.
        error:
          type: string
          description: Catalog error code (e.g. `invalid_query`) when the query failed; mutually exclusive with `response`.
    DeepInput:
      type: object
      additionalProperties: false
      required: [q]
      properties:
        q:
          type: string
          minLength: 1
          maxLength: 2048
        targets:
          type: array
          minItems: 1
          description: >-
            Optional selected Search results. Deep canonicalizes and fetches
            these URLs itself; clients cannot submit document content.
          items: { $ref: '#/components/schemas/DeepTarget' }
        max_fetches:
          type: integer
          minimum: 1
          description: >-
            Optional request cap. It may narrow but never exceed the server's
            configured Deep fetch limit.
    DeepTarget:
      type: object
      additionalProperties: false
      required: [url, provider]
      properties:
        url: { type: string, format: uri }
        title: { type: [string, 'null'], maxLength: 512 }
        provider: { type: string, maxLength: 128 }
    HealthResponse:
      type: object
      additionalProperties: false
      required: [schema_version, status]
      properties:
        schema_version: { $ref: '#/components/schemas/SchemaVersion' }
        status: { type: string, const: ok }
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [schema_version, error]
      properties:
        schema_version: { $ref: '#/components/schemas/SchemaVersion' }
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              description: >-
                Shared error catalog (amatl-core/src/errors.rs). Every AMATL
                surface renders the same identifiers.
              enum: [invalid_request, invalid_query, invalid_url, unauthorized, invalid_host, invalid_origin, rate_limited, body_too_large, headers_too_large, request_timeout, not_found, conflict, egress_denied, fetch_failed, provider_not_declared, provider_not_registered, provider_not_enabled, provider_not_approved, provider_credential_missing, provider_network_blocked, search_planning_failed, configuration_invalid, config_rejected, inference_unavailable, ranking_backend_unavailable, answer_unavailable, storage_unavailable, scope_denied, request_cancelled, serialization_failed, internal_error]
            message: { type: string }
    SearchStatus:
      type: string
      enum: [success, partial_success, failure]
    ResultStatus:
      type: string
      enum: [visible, relegated_by_diversity]
    Degradation:
      type: object
      additionalProperties: false
      required: [code, component, message]
      properties:
        code: { type: string }
        component: { type: string }
        message: { type: string }
    CompositeError:
      type: object
      additionalProperties: false
      required: [code, message, providers, recoverable]
      properties:
        code: { type: string }
        message: { type: string }
        providers:
          type: array
          items: { type: string }
        recoverable: { type: boolean }
    SearchResult:
      type: object
      additionalProperties: false
      required: [schema_version, rank, title, original_url, canonical_url, domain, snippet, providers, published_at, status]
      properties:
        schema_version: { $ref: '#/components/schemas/SchemaVersion' }
        rank: { type: integer, minimum: 1 }
        title: { type: [string, 'null'] }
        original_url: { type: string, format: uri }
        canonical_url: { type: string, format: uri }
        domain: { type: string }
        snippet: { type: [string, 'null'] }
        providers:
          type: array
          items: { type: string }
        published_at: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/ResultStatus' }
    SearchResponse:
      type: object
      additionalProperties: false
      required: [schema_version, query, status, results, providers_used, providers_failed, providers_partial, errors, degradations, elapsed_ms]
      properties:
        schema_version: { $ref: '#/components/schemas/SchemaVersion' }
        query: { type: string }
        status: { $ref: '#/components/schemas/SearchStatus' }
        results:
          type: array
          items: { $ref: '#/components/schemas/SearchResult' }
        providers_used:
          type: array
          items: { type: string }
        providers_failed:
          type: array
          items: { type: string }
        providers_partial:
          type: array
          items: { type: string }
        errors:
          type: array
          items: { $ref: '#/components/schemas/CompositeError' }
        degradations:
          type: array
          items: { $ref: '#/components/schemas/Degradation' }
        elapsed_ms: { type: integer, minimum: 0 }
        total_results:
          type: integer
          minimum: 0
          description: >-
            Size of the whole set when known. It is omitted when a native
            adapter cannot determine a total count from the provider response.
        page: { type: integer, minimum: 0 }
        page_size: { type: integer, minimum: 1, maximum: 100 }
    AnswerSource:
      type: object
      additionalProperties: false
      required: [index, title, url, snippet]
      properties:
        index:
          type: integer
          minimum: 1
          description: 1-based index the model must cite; stable within one response.
        title: { type: [string, 'null'] }
        url: { type: string, format: uri }
        snippet: { type: string }
    Answer:
      type: object
      additionalProperties: false
      required: [text, citations, sources, model]
      properties:
        text:
          type: string
          description: >-
            Citations to sources the response never actually cited are
            stripped from this text before it is returned, not merely
            excluded from the `citations` count.
        citations:
          type: array
          description: Source indices the answer actually cited, in order of first mention.
          items: { type: integer, minimum: 1 }
        sources:
          type: array
          items: { $ref: '#/components/schemas/AnswerSource' }
        model: { type: string }
    AnswerResult:
      type: object
      additionalProperties: false
      required: [schema_version, answer, search]
      properties:
        schema_version: { $ref: '#/components/schemas/SchemaVersion' }
        answer: { $ref: '#/components/schemas/Answer' }
        search:
          $ref: '#/components/schemas/SearchResponse'
          description: The same search AMATL ran to ground the answer, kept alongside it.
    FetchMethod:
      type: string
      description: local is emitted by the CLI-only ingestion contract, not by HTTP Deep
      enum: [http, rendered, local]
    DocumentStatus:
      type: string
      enum: [enriched, superficial, failed]
    Document:
      type: object
      additionalProperties: false
      required: [schema_version, search_result_id, original_url, canonical_url, final_url, content_hash, fetch_method, extractor_used, content_type, size, retrieved_at, status, content, title, author, published_at, metadata]
      properties:
        schema_version: { $ref: '#/components/schemas/SchemaVersion' }
        search_result_id: { type: string }
        original_url: { type: string, format: uri }
        canonical_url: { type: string, format: uri }
        final_url: { type: string, format: uri }
        content_hash: { type: string }
        fetch_method: { $ref: '#/components/schemas/FetchMethod' }
        extractor_used: { type: [string, 'null'] }
        content_type: { type: [string, 'null'] }
        size: { type: integer, minimum: 0 }
        retrieved_at: { type: string }
        status: { $ref: '#/components/schemas/DocumentStatus' }
        content: { type: [string, 'null'] }
        title: { type: [string, 'null'] }
        author: { type: [string, 'null'] }
        published_at: { type: [string, 'null'] }
        metadata:
          type: object
          additionalProperties: { type: string }
    EvidenceStatus:
      type: string
      enum: [complete, partial]
    Evidence:
      type: object
      additionalProperties: false
      required: [schema_version, document_id, status, fact_density, verified_date, metadata_quality, named_entities, citation_count, citation_span, freshness, originality, evidence_score]
      properties:
        schema_version: { $ref: '#/components/schemas/SchemaVersion' }
        document_id: { type: string }
        status: { $ref: '#/components/schemas/EvidenceStatus' }
        fact_density: { type: number, minimum: 0, maximum: 1 }
        verified_date: { type: boolean }
        metadata_quality: { type: number, minimum: 0, maximum: 1 }
        named_entities:
          type: array
          items: { type: string }
        citation_count: { type: integer, minimum: 0 }
        citation_span: { type: number, minimum: 0, maximum: 1 }
        freshness: { type: number, minimum: 0, maximum: 1 }
        originality: { type: number, minimum: 0, maximum: 1 }
        evidence_score: { type: number, minimum: 0, maximum: 1 }
    EvidenceSignal:
      type: string
      enum: [query_match, citation, temporal, numeric]
    EvidenceProvenance:
      type: object
      additionalProperties: false
      required: [schema_version, provenance_id, document_id, original_url, canonical_url, final_url, source_content_hash, extracted_content_hash, fetch_method, extractor_used, retrieved_at, published_at]
      properties:
        schema_version: { $ref: '#/components/schemas/SchemaVersion' }
        provenance_id: { type: string, pattern: '^[0-9a-f]{64}$' }
        document_id: { type: string }
        original_url: { type: string, format: uri }
        canonical_url: { type: string, format: uri }
        final_url: { type: string, format: uri }
        source_content_hash: { type: string }
        extracted_content_hash: { type: [string, 'null'], pattern: '^[0-9a-f]{64}$' }
        fetch_method: { $ref: '#/components/schemas/FetchMethod' }
        extractor_used: { type: [string, 'null'] }
        retrieved_at: { type: string }
        published_at: { type: [string, 'null'] }
    EvidenceFragment:
      type: object
      additionalProperties: false
      required: [schema_version, fragment_id, provenance_id, ordinal, text, start_byte, end_byte, fragment_hash, matched_terms, signals]
      properties:
        schema_version: { $ref: '#/components/schemas/SchemaVersion' }
        fragment_id: { type: string, pattern: '^[0-9a-f]{64}$' }
        provenance_id: { type: string, pattern: '^[0-9a-f]{64}$' }
        ordinal: { type: integer, minimum: 1, maximum: 8 }
        text: { type: string }
        start_byte: { type: integer, minimum: 0 }
        end_byte: { type: integer, minimum: 1 }
        fragment_hash: { type: string, pattern: '^[0-9a-f]{64}$' }
        matched_terms:
          type: array
          items: { type: string }
        signals:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/EvidenceSignal' }
    EvidenceScoreBasis:
      type: object
      additionalProperties: false
      required: [schema_version, fact_density, verified_date, metadata_quality, citation_count, citation_span, freshness, originality]
      properties:
        schema_version: { $ref: '#/components/schemas/SchemaVersion' }
        fact_density: { type: number, minimum: 0, maximum: 1 }
        verified_date: { type: boolean }
        metadata_quality: { type: number, minimum: 0, maximum: 1 }
        citation_count: { type: integer, minimum: 0 }
        citation_span: { type: number, minimum: 0, maximum: 1 }
        freshness: { type: number, minimum: 0, maximum: 1 }
        originality: { type: number, minimum: 0, maximum: 1 }
    EvidenceV2:
      type: object
      additionalProperties: false
      required: [schema_version, evidence_version, document_id, status, provenance, fragments, score_basis, evidence_score]
      properties:
        schema_version: { $ref: '#/components/schemas/SchemaVersion' }
        evidence_version: { type: string, enum: [v2] }
        document_id: { type: string }
        status: { $ref: '#/components/schemas/EvidenceStatus' }
        provenance: { $ref: '#/components/schemas/EvidenceProvenance' }
        fragments:
          type: array
          maxItems: 8
          items: { $ref: '#/components/schemas/EvidenceFragment' }
        score_basis: { $ref: '#/components/schemas/EvidenceScoreBasis' }
        evidence_score: { type: number, minimum: 0, maximum: 1 }
    RankingV2Status:
      type: string
      enum: [applied, disabled, benchmark_rejected, insufficient_documents]
    DeepRankingExplanation:
      type: object
      additionalProperties: false
      required: [ranking_policy, bm25, semantic, reranker, relevance_score, evidence_score, final_score]
      properties:
        ranking_policy: { type: string }
        bm25: { type: number, minimum: 0, maximum: 1 }
        semantic: { type: [number, 'null'], minimum: 0, maximum: 1 }
        reranker: { type: [number, 'null'], minimum: 0, maximum: 1 }
        relevance_score: { type: number, minimum: 0, maximum: 1 }
        evidence_score: { type: number, minimum: 0, maximum: 1 }
        final_score: { type: number, minimum: 0, maximum: 1 }
    DeepRankedDocument:
      type: object
      additionalProperties: false
      required: [document_id, rank, original_rank, relevance_score, evidence_score, final_score, explanation]
      properties:
        document_id: { type: string }
        rank: { type: integer, minimum: 1 }
        original_rank: { type: integer, minimum: 1 }
        relevance_score: { type: number, minimum: 0, maximum: 1 }
        evidence_score: { type: number, minimum: 0, maximum: 1 }
        final_score: { type: number, minimum: 0, maximum: 1 }
        explanation: { $ref: '#/components/schemas/DeepRankingExplanation' }
    RankingV2Output:
      type: object
      additionalProperties: false
      required: [schema_version, policy_version, benchmark_id, status, results]
      properties:
        schema_version: { $ref: '#/components/schemas/SchemaVersion' }
        policy_version: { type: string }
        benchmark_id: { type: string }
        status: { $ref: '#/components/schemas/RankingV2Status' }
        results:
          type: array
          items: { $ref: '#/components/schemas/DeepRankedDocument' }
    GapType:
      type: string
      enum: [primary_source, recency, geographic_diversity, documentation, pdf, code, specification, source_diversity]
    GapSeverity:
      type: string
      enum: [low, medium, high]
    Gap:
      type: object
      additionalProperties: false
      required: [schema_version, gap_type, severity, reason, recommended_query, estimated_cost, expected_gain, status]
      properties:
        schema_version: { $ref: '#/components/schemas/SchemaVersion' }
        gap_type: { $ref: '#/components/schemas/GapType' }
        severity: { $ref: '#/components/schemas/GapSeverity' }
        reason: { type: string }
        recommended_query: { type: [string, 'null'] }
        estimated_cost: { type: [integer, 'null'], minimum: 0 }
        expected_gain: { type: [integer, 'null'], minimum: 0 }
        status: { type: string, const: detected }
    SubQueryStatus:
      type: string
      enum: [proposed, executed, failed, rejected_budget, invalid]
    SubQuery:
      type: object
      additionalProperties: false
      required: [schema_version, raw_query, reason, gap_type, estimated_cost, expected_gain, actual_gain, status, results, errors]
      properties:
        schema_version: { $ref: '#/components/schemas/SchemaVersion' }
        raw_query: { type: string }
        reason: { type: string }
        gap_type: { $ref: '#/components/schemas/GapType' }
        estimated_cost: { type: integer, minimum: 0 }
        expected_gain: { type: integer, minimum: 0 }
        actual_gain: { type: integer, minimum: 0 }
        status: { $ref: '#/components/schemas/SubQueryStatus' }
        results:
          type: array
          items: { $ref: '#/components/schemas/SearchResult' }
        errors:
          type: array
          items: { $ref: '#/components/schemas/CompositeError' }
    DeepResponse:
      type: object
      additionalProperties: false
      required: [schema_version, query, documents, errors, degradations, evidence, evidence_v2, ranking_v2, gaps, subqueries, elapsed_ms]
      properties:
        schema_version: { $ref: '#/components/schemas/SchemaVersion' }
        query: { type: string }
        documents:
          type: array
          items: { $ref: '#/components/schemas/Document' }
        errors:
          type: array
          items: { $ref: '#/components/schemas/CompositeError' }
        degradations:
          type: array
          items: { $ref: '#/components/schemas/Degradation' }
        evidence:
          type: array
          items: { $ref: '#/components/schemas/Evidence' }
        evidence_v2:
          type: array
          items: { $ref: '#/components/schemas/EvidenceV2' }
        ranking_v2: { $ref: '#/components/schemas/RankingV2Output' }
        gaps:
          type: array
          items: { $ref: '#/components/schemas/Gap' }
        subqueries:
          type: array
          items: { $ref: '#/components/schemas/SubQuery' }
        elapsed_ms: { type: integer, minimum: 0 }
    ProviderSurfaceStatus:
      type: string
      enum: [available, unavailable]
    ProviderCapabilities:
      type: object
      additionalProperties: false
      required: [schema_version, pagination, language, region, time_range, site_filter, file_filter, news, code, docs, academic, authentication, estimated_cost]
      properties:
        schema_version: { $ref: '#/components/schemas/SchemaVersion' }
        pagination: { type: boolean }
        language: { type: boolean }
        region: { type: boolean }
        time_range: { type: boolean }
        site_filter: { type: boolean }
        file_filter: { type: boolean }
        news: { type: boolean }
        code: { type: boolean }
        docs: { type: boolean }
        academic: { type: boolean }
        authentication: { type: boolean }
        estimated_cost: { type: [integer, 'null'], minimum: 0 }
    ProviderSummary:
      type: object
      additionalProperties: false
      required: [schema_version, name, status, code, capabilities, enabled, credential_source]
      properties:
        schema_version: { $ref: '#/components/schemas/SchemaVersion' }
        name: { type: string }
        status: { $ref: '#/components/schemas/ProviderSurfaceStatus' }
        code: { type: [string, 'null'] }
        capabilities: { $ref: '#/components/schemas/ProviderCapabilities' }
        enabled: { type: boolean }
        credential_source: { $ref: '#/components/schemas/CredentialSource' }
    ProviderResponse:
      type: object
      additionalProperties: false
      required: [schema_version, providers]
      properties:
        schema_version: { $ref: '#/components/schemas/SchemaVersion' }
        providers:
          type: array
          items: { $ref: '#/components/schemas/ProviderSummary' }
    CircuitState:
      type: string
      description: Persistent breaker state for one source.
      enum: [closed, open, half_open]
    CredentialSource:
      type: string
      description: Provenance of the credential in force for a source; never its value. `ephemeral` is an operator key held only in memory and liquidable at runtime; `environment` came from the variable named by `credential_env`.
      enum: [none, ephemeral, environment]
    SourceStatus:
      type: object
      additionalProperties: false
      required: [name, status, code, circuit, success_rate, average_latency_ms, observations, credential_source]
      properties:
        name: { type: string }
        status: { $ref: '#/components/schemas/ProviderSurfaceStatus' }
        code: { type: [string, 'null'] }
        circuit: { $ref: '#/components/schemas/CircuitState' }
        success_rate: { type: [number, 'null'], minimum: 0, maximum: 1 }
        average_latency_ms: { type: [number, 'null'], minimum: 0 }
        observations: { type: integer, minimum: 0 }
        credential_source: { $ref: '#/components/schemas/CredentialSource' }
    StorageStatus:
      type: object
      additionalProperties: false
      required: [enabled, available, migration_version, history_entries, saved_documents, message]
      properties:
        enabled: { type: boolean }
        available: { type: boolean }
        migration_version: { type: [integer, 'null'] }
        history_entries: { type: [integer, 'null'] }
        saved_documents: { type: [integer, 'null'] }
        message: { type: [string, 'null'] }
    CacheStatus:
      type: object
      additionalProperties: false
      required:
        - provider_search_enabled
        - document_enabled
        - provider_search_entries
        - provider_search_bytes
        - document_entries
        - document_bytes
        - provider_search_hits
        - provider_search_misses
        - provider_search_hit_rate
        - document_hits
        - document_misses
        - document_hit_rate
      properties:
        provider_search_enabled: { type: boolean }
        document_enabled: { type: boolean }
        provider_search_entries: { type: integer, minimum: 0 }
        provider_search_bytes: { type: integer, minimum: 0 }
        document_entries: { type: integer, minimum: 0 }
        document_bytes: { type: integer, minimum: 0 }
        provider_search_hits: { type: integer, minimum: 0 }
        provider_search_misses: { type: integer, minimum: 0 }
        provider_search_hit_rate: { type: number, minimum: 0, maximum: 1 }
        document_hits: { type: integer, minimum: 0 }
        document_misses: { type: integer, minimum: 0 }
        document_hit_rate: { type: number, minimum: 0, maximum: 1 }
    AnswerStatus:
      type: object
      additionalProperties: false
      required: [enabled, configured, available, model, endpoint]
      properties:
        enabled:
          type: boolean
          description: >-
            answer.enabled in configuration — the operator's on/off intent,
            exactly what POST /answer/enabled flips.
        configured:
          type: boolean
          description: >-
            Whether endpoint and model are both present, regardless of
            enabled — "is there a real configuration on disk to toggle",
            answered even while the feature is switched off.
        available:
          type: boolean
          description: >-
            Whether a call to POST /answer will actually work right now:
            enabled AND configured AND the credential was present in the
            environment at startup. A UI should gate the feature on this,
            not on enabled or configured alone.
        model: { type: [string, 'null'] }
        endpoint: { type: [string, 'null'] }
    ServiceStatus:
      type: object
      additionalProperties: false
      required: [schema_version, status, authentication_required, sources, storage, cache, inference_backend, answer, strategist, data_policy]
      properties:
        schema_version: { $ref: '#/components/schemas/SchemaVersion' }
        status: { type: string, enum: [ok, degraded] }
        authentication_required:
          type: boolean
          description: Whether protected HTTP and MCP routes require a bearer token.
        sources:
          type: array
          items: { $ref: '#/components/schemas/SourceStatus' }
        storage: { $ref: '#/components/schemas/StorageStatus' }
        cache: { $ref: '#/components/schemas/CacheStatus' }
        inference_backend: { type: [string, 'null'] }
        answer:
          $ref: '#/components/schemas/AnswerStatus'
          description: >-
            Read-only view of the answer-synthesis configuration: never the
            credential, only what a settings screen needs to explain why the
            feature is or isn't available right now.
        strategist:
          $ref: '#/components/schemas/StrategistStatus'
          description: >-
            Read-only view of the search-strategist configuration: whether the
            optional LLM may participate in a search. Never the credential, only
            what a settings screen needs to explain why the "search with model"
            toggle is or isn't usable.
        data_policy:
          $ref: '#/components/schemas/DataPolicyStatus'
          description: >-
            Read-only view of data_policy — the profile, egress and inference
            gate every other capability in this status checks against. Exposed
            so a settings screen can explain why a source, remote embedding or
            answer call is unavailable instead of just reporting that it is.
    DataPolicyStatus:
      type: object
      additionalProperties: false
      required: [profile, egress, inference]
      properties:
        profile:
          type: string
          enum: [standard, isolated]
          description: >-
            data_policy.profile. The isolated profile is fail-closed before any
            network egress, so providers, Deep fetch and remote inference are
            all unavailable while it is set.
        egress:
          type: string
          enum: [deny, governed]
          description: >-
            data_policy.egress. `deny` blocks all outbound network; `governed`
            allows only what the provider/governance records approve.
        inference:
          type: string
          enum: [disabled, local_only, remote_explicit]
          description: >-
            data_policy.inference. `remote_explicit` permits an operator-approved
            remote embedding/answer endpoint; `local_only` restricts inference to
            an on-device backend.
    StrategistStatus:
      type: object
      additionalProperties: false
      required: [enabled, configured, available, model, endpoint]
      properties:
        enabled:
          type: boolean
          description: >-
            strategist.enabled in configuration — the operator's on/off intent,
            exactly what POST /strategist/enabled flips.
        configured:
          type: boolean
          description: >-
            Whether endpoint and model are both present, regardless of enabled —
            "is there a real configuration on disk to toggle".
        available:
          type: boolean
          description: >-
            Whether calling the strategist would work right now: enabled AND
            configured AND the credential environment variable was present. A UI
            should gate the feature on this, not on enabled or configured alone.
        model: { type: [string, 'null'] }
        endpoint: { type: [string, 'null'] }
    SearchHistoryEntry:
      type: object
      additionalProperties: false
      required: [id, normalized_query, raw_query, category, provider_count, total_results, deep_fetches, created_at, surface]
      properties:
        id: { type: integer }
        normalized_query: { type: string }
        raw_query: { type: string }
        category: { type: [string, 'null'] }
        provider_count: { type: integer, minimum: 0 }
        total_results: { type: integer, minimum: 0 }
        deep_fetches: { type: integer, minimum: 0 }
        created_at: { type: integer, description: Unix seconds }
        surface: { type: string, enum: [cli, api, mcp] }
    HistoryResponse:
      type: object
      additionalProperties: false
      required: [schema_version, entries]
      properties:
        schema_version: { $ref: '#/components/schemas/SchemaVersion' }
        entries:
          type: array
          items: { $ref: '#/components/schemas/SearchHistoryEntry' }
    SavedDocument:
      type: object
      additionalProperties: false
      required: [id, canonical_url, title, snippet, content_hash, extractor_version, payload, size_bytes, saved_at, source_query, tags]
      properties:
        id: { type: integer }
        canonical_url: { type: string, format: uri }
        title: { type: [string, 'null'] }
        snippet: { type: [string, 'null'] }
        content_hash: { type: string, pattern: '^[0-9a-fA-F]{64}$' }
        extractor_version: { type: string }
        payload: { type: string }
        size_bytes: { type: integer, minimum: 0 }
        saved_at: { type: integer, description: Unix seconds }
        source_query: { type: [string, 'null'] }
        tags: { type: string, description: Comma-separated tag list }
    SavedDocumentsResponse:
      type: object
      additionalProperties: false
      required: [schema_version, documents]
      properties:
        schema_version: { $ref: '#/components/schemas/SchemaVersion' }
        documents:
          type: array
          items: { $ref: '#/components/schemas/SavedDocument' }
    SaveDocumentInput:
      type: object
      additionalProperties: false
      required: [canonical_url, content_hash, extractor_version, payload]
      properties:
        canonical_url: { type: string, format: uri, description: Public http(s) URL }
        title: { type: [string, 'null'] }
        snippet: { type: [string, 'null'] }
        content_hash: { type: string, pattern: '^[0-9a-fA-F]{64}$' }
        extractor_version: { type: string, minLength: 1, maxLength: 128 }
        payload:
          type: string
          description: Bounded by persistence.saved_document_max_bytes (default 1 MiB)
        source_query: { type: [string, 'null'] }
        tags:
          type: array
          maxItems: 16
          items: { type: string, maxLength: 64 }
    DeletedResponse:
      type: object
      additionalProperties: false
      required: [schema_version, deleted]
      properties:
        schema_version: { $ref: '#/components/schemas/SchemaVersion' }
        deleted: { type: integer, minimum: 0 }
    ReloadReport:
      type: object
      additionalProperties: false
      required: [schema_version, config_file, declared_sources, enabled_sources, registered_sources, inference_backend, clients]
      properties:
        schema_version: { $ref: '#/components/schemas/SchemaVersion' }
        config_file: { type: [string, 'null'] }
        declared_sources:
          type: array
          items: { type: string }
        enabled_sources:
          type: array
          items: { type: string }
        registered_sources:
          type: array
          description: Sources with a registered factory in this process.
          items: { type: string }
        inference_backend: { type: [string, 'null'] }
        clients:
          type: array
          description: Configured server client identifiers.
          items: { type: string }
    SecurityEvent:
      type: object
      additionalProperties: false
      required: [id, observed_at, event, request_id, client_id, path, client_ip]
      properties:
        id: { type: integer }
        observed_at: { type: integer, description: Unix seconds }
        event:
          type: string
          description: Stable rejection name, for example unauthorized or scope_denied.
        request_id: { type: [string, 'null'] }
        client_id: { type: [string, 'null'] }
        path: { type: [string, 'null'] }
        client_ip: { type: [string, 'null'] }
    SecurityEventsResponse:
      type: object
      additionalProperties: false
      required: [schema_version, events, dropped]
      properties:
        schema_version: { $ref: '#/components/schemas/SchemaVersion' }
        events:
          type: array
          items: { $ref: '#/components/schemas/SecurityEvent' }
        dropped:
          type: integer
          minimum: 0
          description: Events discarded because too many audit writes were in flight.
