openapi: 3.1.0
info:
  title: AMATL HTTP API
  version: 0.1.0-rc.1
  description: |
    HTTP contract exposed by amatl-server. Binary SemVer is independent from
    the string schema_version carried by AMATL data contracts. Every response
    produced by the application includes a server-generated X-Request-ID; an
    inbound value is never trusted or echoed.

    Errors are deliberately not RFC 7807 problem documents. Every surface (CLI,
    API, MCP, UI) renders the shared code catalog in amatl-core/src/errors.rs,
    so the wire shape is ErrorResponse with a stable snake_case code. Adding a
    code is a compatible change; renaming or removing one is not.

    The listener carries no URI version prefix. A breaking change is published
    as a new binary major version and, when the data contract changes, a new
    schema_version; a client negotiates by inspecting both rather than by path.

    Every operation documents the same transport-level rejections because one
    middleware wraps the whole router: 400 invalid_host, 403 invalid_origin or
    scope_denied, 429 rate_limited, 431 headers_too_large and 504
    request_timeout, plus 401 on protected operations and 413 on operations with
    a request body. They repeat per operation instead of being described once
    here so a generated client can model them. The rate limit is keyed on the
    socket peer address; X-Forwarded-For is ignored on purpose, because
    honouring a client-supplied header would let a caller evade its own budget.
servers:
  - url: http://127.0.0.1:8080
    description: Default loopback development listener
security:
  - bearerAuth: []
paths:
  /search:
    get:
      operationId: searchGet
      summary: Search configured providers
      description: Compatibility endpoint. Prefer POST so query text is not placed in the request target.
      deprecated: true
      parameters:
        - $ref: '#/components/parameters/Query'
      responses:
        '200':
          description: Search completed; inspect status for success, partial_success, or failure
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '431': { $ref: '#/components/responses/HeadersTooLarge' }
        '500': { $ref: '#/components/responses/ServiceUnavailable' }
        '504': { $ref: '#/components/responses/RequestTimeout' }
    post:
      operationId: searchPost
      summary: Search configured providers using a JSON body
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryInput'
      responses:
        '200':
          description: Search completed; inspect the application status field
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/BodyTooLarge' }
        '422': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '431': { $ref: '#/components/responses/HeadersTooLarge' }
        '500': { $ref: '#/components/responses/ServiceUnavailable' }
        '504': { $ref: '#/components/responses/RequestTimeout' }
  /search/batch:
    get:
      operationId: searchBatchGet
      summary: Run several independent searches in one request
      description: >-
        Executes each repeated `q` parameter as an independent search (its own
        budget and orchestrator) and returns one outcome per query in caller
        order. The envelope requires at least one `q` and at most five. Query
        execution is independent: one failing query is reported as that item's
        `error` while the usable rows still return.
      parameters:
        - name: q
          in: query
          required: true
          description: A search query. Repeat for multiple queries (1..=5).
          schema:
            type: array
            items: { type: string }
            minItems: 1
            maxItems: 5
      responses:
        '200':
          description: One outcome per submitted query, in order
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchBatchResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '431': { $ref: '#/components/responses/HeadersTooLarge' }
        '500': { $ref: '#/components/responses/ServiceUnavailable' }
        '504': { $ref: '#/components/responses/RequestTimeout' }
  /deep:
    post:
      operationId: deepPost
      summary: Run bounded Deep enrichment using a JSON body or selected Search targets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeepInput'
      responses:
        '200':
          description: Deep response, including partial documents and degradations
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeepResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/BodyTooLarge' }
        '422': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '431': { $ref: '#/components/responses/HeadersTooLarge' }
        '500': { $ref: '#/components/responses/ServiceUnavailable' }
        '504': { $ref: '#/components/responses/RequestTimeout' }
  /answer:
    post:
      operationId: answerPost
      summary: Run Search and synthesize a grounded, cited answer from it
      description: >-
        Runs the same search `/search` would and additionally asks the
        configured model to answer from those results only, citing `[n]`
        markers the response validates against real source indices — a
        citation to a source that was never retrieved is stripped from the
        visible text, not merely uncounted. Requires
        `data_policy.inference = "remote_explicit"` and `answer.enabled`;
        returns `answer_unavailable` otherwise, or when the model's response
        cited no valid source at all (a refusal, not a best-effort guess).
        The raw search results are always included alongside the answer, so a
        caller has them even when it only wants the summary.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryInput'
      responses:
        '200':
          description: Search completed and an answer was synthesized and grounded
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerResult'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/BodyTooLarge' }
        '422': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '431': { $ref: '#/components/responses/HeadersTooLarge' }
        '500': { $ref: '#/components/responses/ServiceUnavailable' }
        '504': { $ref: '#/components/responses/RequestTimeout' }
    patch:
      operationId: answerUpdate
      summary: Update answer synthesis settings and apply them live
      description: Admin-scoped partial update of `[answer]`; unset fields are preserved.
      requestBody: { $ref: '#/components/requestBodies/AnswerPatch' }
      responses:
        '200': { $ref: '#/components/responses/ReloadReport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/BodyTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '431': { $ref: '#/components/responses/HeadersTooLarge' }
        '500': { $ref: '#/components/responses/ServiceUnavailable' }
        '504': { $ref: '#/components/responses/RequestTimeout' }
  /answer/enabled:
    post:
      operationId: answerToggle
      summary: Flip answer.enabled in the configuration file and apply it live
      description: >-
        Admin-scoped, same trust tier as `/reload` (which this reuses for the
        actual apply step). Builds a candidate configuration with the flag
        flipped and validates it *before* writing anything: turning the
        feature on when `answer.endpoint`/`answer.model` are still incomplete
        fails closed with `configuration_invalid` and neither the file nor
        the running service change. On success, writes only `answer.enabled`
        to the configuration file with comments and every other key
        preserved, then reloads the service without a restart.
      requestBody: { $ref: '#/components/requestBodies/ToggleEnabled' }
      responses:
        '200':
          description: The flag was written and the service reloaded with it applied
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReloadReport'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/BodyTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '431': { $ref: '#/components/responses/HeadersTooLarge' }
        '500': { $ref: '#/components/responses/ServiceUnavailable' }
        '504': { $ref: '#/components/responses/RequestTimeout' }
  /strategist/enabled:
    post:
      operationId: strategistToggle
      summary: Flip strategist.enabled to include the LLM in search, applied live
      description: >-
        Admin-scoped, same trust tier as `/answer/enabled` and `/reload`
        (which this reuses for the actual apply step). Controls whether the
        LLM participates in a search: with it on, the strategist proposes a
        refined query that AMATL runs to complement the first result set;
        with it off (the default), search and deep remain fully
        deterministic and the LLM does not participate at all. Builds a
        candidate configuration with the flag flipped and validates it
        *before* writing anything: turning it on when
        `strategist.endpoint`/`strategist.model` are still incomplete fails
        closed with `configuration_invalid` and neither the file nor the
        running service change. On success, writes only `strategist.enabled`
        to the configuration file with comments and every other key
        preserved, then reloads the service without a restart.
      requestBody: { $ref: '#/components/requestBodies/ToggleEnabled' }
      responses:
        '200':
          description: The flag was written and the service reloaded with it applied
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReloadReport'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/BodyTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '431': { $ref: '#/components/responses/HeadersTooLarge' }
        '500': { $ref: '#/components/responses/ServiceUnavailable' }
        '504': { $ref: '#/components/responses/RequestTimeout' }
  /providers:
    get:
      operationId: providers
      summary: List configured provider availability and capabilities
      responses:
        '200':
          description: Provider summaries
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '431': { $ref: '#/components/responses/HeadersTooLarge' }
        '500': { $ref: '#/components/responses/ServiceUnavailable' }
        '504': { $ref: '#/components/responses/RequestTimeout' }
  /status:
    get:
      operationId: status
      summary: Operator state of sources, local persistence and caches
      responses:
        '200':
          description: Aggregated service state; never includes ranking internals
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceStatus'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '431': { $ref: '#/components/responses/HeadersTooLarge' }
        '500': { $ref: '#/components/responses/ServiceUnavailable' }
        '503': { $ref: '#/components/responses/StorageUnavailable' }
        '504': { $ref: '#/components/responses/RequestTimeout' }
  /reload:
    post:
      operationId: reload
      summary: Rebuild the service from configuration without restarting
      description: >-
        Re-reads the configuration file the process was started with, validates
        it and swaps a fully built service. Adding, removing or re-approving a
        source therefore needs no restart. A rejected configuration changes
        nothing and reports why. `SIGHUP` performs the same reload on Unix.
      responses:
        '200':
          description: What the reload put in place
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReloadReport'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '431': { $ref: '#/components/responses/HeadersTooLarge' }
        '500': { $ref: '#/components/responses/ServiceUnavailable' }
        '504': { $ref: '#/components/responses/RequestTimeout' }
  /security-events:
    get:
      operationId: securityEvents
      summary: Recorded security rejections, newest first
      description: >-
        Durable copy of the rejections logged at the HTTP edge. Requires the
        admin scope, because the trail names client identities and addresses.
        Requires persistence; without it the endpoint reports
        `storage_unavailable` instead of an empty trail.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Recorded events and the number dropped under saturation
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityEventsResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '431': { $ref: '#/components/responses/HeadersTooLarge' }
        '503': { $ref: '#/components/responses/StorageUnavailable' }
        '504': { $ref: '#/components/responses/RequestTimeout' }
  /history:
    get:
      operationId: historyList
      summary: List locally recorded searches, newest first
      description: Requires persistence.enabled; the history never leaves the machine.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Recorded searches
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '431': { $ref: '#/components/responses/HeadersTooLarge' }
        '503': { $ref: '#/components/responses/StorageUnavailable' }
        '504': { $ref: '#/components/responses/RequestTimeout' }
    delete:
      operationId: historyPurge
      summary: Delete every recorded search
      responses:
        '200':
          description: Number of deleted entries
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '431': { $ref: '#/components/responses/HeadersTooLarge' }
        '503': { $ref: '#/components/responses/StorageUnavailable' }
        '504': { $ref: '#/components/responses/RequestTimeout' }
  /history/{id}:
    delete:
      operationId: historyDelete
      summary: Delete one recorded search
      parameters:
        - $ref: '#/components/parameters/EntryId'
      responses:
        '200':
          description: Entry deleted
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '431': { $ref: '#/components/responses/HeadersTooLarge' }
        '503': { $ref: '#/components/responses/StorageUnavailable' }
        '504': { $ref: '#/components/responses/RequestTimeout' }
  /saved:
    get:
      operationId: savedList
      summary: List saved documents, newest first
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Saved documents
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedDocumentsResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '431': { $ref: '#/components/responses/HeadersTooLarge' }
        '503': { $ref: '#/components/responses/StorageUnavailable' }
        '504': { $ref: '#/components/responses/RequestTimeout' }
    post:
      operationId: savedPut
      summary: Persist one document for cross-session reuse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveDocumentInput'
      responses:
        '200':
          description: Identifier of the stored document
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [schema_version, id]
                properties:
                  schema_version: { $ref: '#/components/schemas/SchemaVersion' }
                  id: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/BodyTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '431': { $ref: '#/components/responses/HeadersTooLarge' }
        '503': { $ref: '#/components/responses/StorageUnavailable' }
        '504': { $ref: '#/components/responses/RequestTimeout' }
  /saved/{id}:
    delete:
      operationId: savedDelete
      summary: Delete one saved document
      parameters:
        - $ref: '#/components/parameters/EntryId'
      responses:
        '200':
          description: Document deleted
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '431': { $ref: '#/components/responses/HeadersTooLarge' }
        '503': { $ref: '#/components/responses/StorageUnavailable' }
        '504': { $ref: '#/components/responses/RequestTimeout' }
  /metrics:
    get:
      operationId: metrics
      summary: Prometheus exposition of request, latency, aggregate source and cache metrics
      description: >-
        Public like /health so a local scraper needs no credential, and
        deliberately coarse for the same reason /ready is: request counters,
        p50/p95/p99 latency over the last 1024 requests per surface, cache hit
        rates, whether local persistence is usable, and aggregate source counts
        (declared, available, in circuit cooldown, plus the worst observed
        success rate and latency). Source names never appear as label values;
        per-source detail requires the read scope and lives on /status.
      security: []
      responses:
        '200':
          description: Prometheus text exposition format (version 0.0.4)
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
          content:
            text/plain:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '431': { $ref: '#/components/responses/HeadersTooLarge' }
        '504': { $ref: '#/components/responses/RequestTimeout' }
  /health:
    get:
      operationId: health
      summary: Lightweight process availability check
      security: []
      responses:
        '200':
          description: Router is available; this does not check providers or SQLite
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '431': { $ref: '#/components/responses/HeadersTooLarge' }
        '504': { $ref: '#/components/responses/RequestTimeout' }
  # AUDIT-01: administrative routes implemented by amatl-server.
  /providers/{name}:
    parameters: [{ $ref: '#/components/parameters/ProviderName' }]
    get:
      operationId: providerRecord
      summary: Read a provider governance record
      responses:
        '200': { $ref: '#/components/responses/ProviderRecord' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '431': { $ref: '#/components/responses/HeadersTooLarge' }
        '504': { $ref: '#/components/responses/RequestTimeout' }
    patch:
      operationId: providerRecordUpdate
      summary: Upsert a provider governance record
      requestBody: { $ref: '#/components/requestBodies/ProviderRecord' }
      responses:
        '200': { $ref: '#/components/responses/ProviderRecord' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/BodyTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '431': { $ref: '#/components/responses/HeadersTooLarge' }
        '504': { $ref: '#/components/responses/RequestTimeout' }
  /providers/{name}/enabled:
    parameters: [{ $ref: '#/components/parameters/ProviderName' }]
    post:
      operationId: providerToggle
      summary: Enable or disable a declared provider and reload it
      requestBody: { $ref: '#/components/requestBodies/ProviderToggleEnabled' }
      responses:
        '200': { $ref: '#/components/responses/ReloadReport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/BodyTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '431': { $ref: '#/components/responses/HeadersTooLarge' }
