  /persistence/backup:
    post:
      operationId: persistenceBackupCreate
      summary: Create an on-demand database backup
      description: >-
        Writes the same kind of backup the periodic maintenance task writes,
        right now. Without `Idempotency-Key` every accepted call writes a new
        file, so a client that retries blindly — after a 504, say — can push an
        older backup out of the auto_backup_max_count rotation. Send
        `Idempotency-Key` to make such a retry replay the first result instead.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { $ref: '#/components/responses/BackupCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '431': { $ref: '#/components/responses/HeadersTooLarge' }
        '503': { $ref: '#/components/responses/StorageUnavailable' }
        '504':
          description: >-
            The request deadline expired, but the write is not cancelled: it
            continues in the background, because interrupting VACUUM INTO would
            leave a partial file beside the live database. The backup may
            therefore exist even though this response was returned. Reconcile
            with GET /persistence/backups, and retry with the same
            Idempotency-Key rather than without one.
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
