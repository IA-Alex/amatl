[package]
name = "amatl-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "../../README.md"
description = "Core types, search pipeline, provider registry, and persistence for the Amatl multi-source search engine"
keywords = ["search", "metasearch", "aggregator"]
categories = ["web-programming::http-client", "development-tools"]

[features]
# STEP 4D — EXPERIMENTAL. Compiles in the local-embedding integration boundary
# (`experimental_embeddings`) AND the real pure-Rust Candle backend
# (`experimental_embeddings::candle`). OFF by default.
#
# When DISABLED (the default): the module is not compiled, none of the Candle
# dependencies below are in the dependency graph or the default `cargo build`,
# and nothing on the search path changes — byte-for-byte identical behaviour.
#
# When ENABLED: adds the pure-Rust `candle-core`/`candle-nn`/`candle-transformers`
# 0.9 stack + `tokenizers` (fancy-regex, no `onig_sys` C dep) + `safetensors` +
# `memmap2`. Still OFF the default search path unless, additionally, a valid
# model package is present and a result lands in the ambiguous relevance band.
# Even then the embedding signal is advisory-only: it can never promote a
# high-confidence entity/intent contradiction, and it never mutates routing,
# ranking, telemetry, or provider selection.
experimental-local-embeddings = [
    "dep:candle-core",
    "dep:candle-nn",
    "dep:candle-transformers",
    "dep:tokenizers",
    "dep:safetensors",
    "dep:memmap2",
]

[dependencies]
async-trait.workspace = true
http.workspace = true
reqwest.workspace = true
scraper.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
toml.workspace = true
toml_edit.workspace = true
tracing.workspace = true
url.workspace = true
unicode-normalization.workspace = true
fs2.workspace = true
tokio-util.workspace = true

# STEP 4D — real Candle backend, OPTIONAL, only pulled in by
# `experimental-local-embeddings`. Pure Rust: no C++ runtime, no `-sys` crates,
# musl-clean. Versions pinned to the STEP 4B feasibility set.
candle-core = { version = "0.9.2", default-features = false, optional = true }
candle-nn = { version = "0.9.2", default-features = false, optional = true }
candle-transformers = { version = "0.9.2", default-features = false, optional = true }
# `unstable_wasm` selects the pure-Rust `fancy-regex` backend (no `onig_sys`).
tokenizers = { version = "0.20.4", default-features = false, features = ["unstable_wasm"], optional = true }
safetensors = { version = "0.7.0", optional = true }
memmap2 = { version = "0.9", optional = true }

[dev-dependencies]
axum.workspace = true
axum-server.workspace = true
criterion = "0.7"
proptest = "1"
rcgen = "0.14.8"

[[bench]]
name = "core_contracts"
harness = false

[lints]
workspace = true
