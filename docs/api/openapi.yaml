openapi: 3.1.0
info:
  title: AMATL HTTP API
  version: 0.1.0-rc.1
  description: |
    HTTP contract exposed by amatl-server. Binary SemVer is independent from
    the string schema_version carried by AMATL data contracts. Every response
    produced by the application includes a server-generated X-Request-ID; an
    inbound value is never trusted or echoed.
servers:
  - url: http://127.0.0.1:8080
    description: Default loopback development listener
security:
  - bearerAuth: []
paths:
  /search:
    get:
      operationId: searchGet
      summary: Search configured providers
      description: Compatibility endpoint. Prefer POST so query text is not placed in the request target.
      deprecated: true
      parameters:
        - $ref: '#/components/parameters/Query'
      responses:
        '200':
          description: Search completed; inspect status for success, partial_success, or failure
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '431': { $ref: '#/components/responses/HeadersTooLarge' }
        '500': { $ref: '#/components/responses/ServiceUnavailable' }
        '504': { $ref: '#/components/responses/RequestTimeout' }
    post:
      operationId: searchPost
      summary: Search configured providers using a JSON body
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryInput'
      responses:
        '200':
          description: Search completed; inspect the application status field
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/BodyTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '431': { $ref: '#/components/responses/HeadersTooLarge' }
        '500': { $ref: '#/components/responses/ServiceUnavailable' }
        '504': { $ref: '#/components/responses/RequestTimeout' }
  /deep:
    get:
      operationId: deepGet
      summary: Run bounded Deep enrichment after Search
      parameters:
        - $ref: '#/components/parameters/Query'
      responses:
        '200':
          description: Deep response, including partial documents and degradations
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeepResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '431': { $ref: '#/components/responses/HeadersTooLarge' }
        '500': { $ref: '#/components/responses/ServiceUnavailable' }
        '504': { $ref: '#/components/responses/RequestTimeout' }
    post:
      operationId: deepPost
      summary: Run bounded Deep enrichment using a JSON body
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryInput'
      responses:
        '200':
          description: Deep response, including partial documents and degradations
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeepResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/BodyTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '431': { $ref: '#/components/responses/HeadersTooLarge' }
        '500': { $ref: '#/components/responses/ServiceUnavailable' }
        '504': { $ref: '#/components/responses/RequestTimeout' }
  /providers:
    get:
      operationId: providers
      summary: List configured provider availability and capabilities
      responses:
        '200':
          description: Provider summaries
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '431': { $ref: '#/components/responses/HeadersTooLarge' }
        '500': { $ref: '#/components/responses/ServiceUnavailable' }
        '504': { $ref: '#/components/responses/RequestTimeout' }
  /status:
    get:
      operationId: status
      summary: Operator state of sources, local persistence and caches
      responses:
        '200':
          description: Aggregated service state; never includes ranking internals
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceStatus'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServiceUnavailable' }
        '503': { $ref: '#/components/responses/StorageUnavailable' }
        '504': { $ref: '#/components/responses/RequestTimeout' }
  /reload:
    post:
      operationId: reload
      summary: Rebuild the service from configuration without restarting
      description: >-
        Re-reads the configuration file the process was started with, validates
        it and swaps a fully built service. Adding, removing or re-approving a
        source therefore needs no restart. A rejected configuration changes
        nothing and reports why. `SIGHUP` performs the same reload on Unix.
      responses:
        '200':
          description: What the reload put in place
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReloadReport'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServiceUnavailable' }
        '504': { $ref: '#/components/responses/RequestTimeout' }
  /history:
    get:
      operationId: historyList
      summary: List locally recorded searches, newest first
      description: Requires persistence.enabled; the history never leaves the machine.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Recorded searches
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/StorageUnavailable' }
        '504': { $ref: '#/components/responses/RequestTimeout' }
    delete:
      operationId: historyPurge
      summary: Delete every recorded search
      responses:
        '200':
          description: Number of deleted entries
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/StorageUnavailable' }
  /history/{id}:
    delete:
      operationId: historyDelete
      summary: Delete one recorded search
      parameters:
        - $ref: '#/components/parameters/EntryId'
      responses:
        '200':
          description: Entry deleted
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/StorageUnavailable' }
  /saved:
    get:
      operationId: savedList
      summary: List saved documents, newest first
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Saved documents
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedDocumentsResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/StorageUnavailable' }
    post:
      operationId: savedPut
      summary: Persist one document for cross-session reuse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveDocumentInput'
      responses:
        '200':
          description: Identifier of the stored document
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [schema_version, id]
                properties:
                  schema_version: { $ref: '#/components/schemas/SchemaVersion' }
                  id: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/BodyTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/StorageUnavailable' }
  /saved/{id}:
    delete:
      operationId: savedDelete
      summary: Delete one saved document
      parameters:
        - $ref: '#/components/parameters/EntryId'
      responses:
        '200':
          description: Document deleted
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/StorageUnavailable' }
  /metrics:
    get:
      operationId: metrics
      summary: Prometheus exposition of request, latency, source and cache metrics
      description: >-
        Public like /health so a local scraper needs no credential. Exposes
        request counters, p50/p95/p99 latency over the last 1024 requests per
        surface, per-source availability and observed value, cache hit rates
        and whether local persistence is usable. Source names appear as label
        values; do not expose this port outside the host if configured source
        names are sensitive.
      security: []
      responses:
        '200':
          description: Prometheus text exposition format (version 0.0.4)
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
          content:
            text/plain:
              schema: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '504': { $ref: '#/components/responses/RequestTimeout' }
  /health:
    get:
      operationId: health
      summary: Lightweight process availability check
      security: []
      responses:
        '200':
          description: Router is available; this does not check providers or SQLite
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '431': { $ref: '#/components/responses/HeadersTooLarge' }
        '504': { $ref: '#/components/responses/RequestTimeout' }
components:
  headers:
    RequestId:
      description: Opaque correlation identifier generated independently for this request
      schema:
        type: string
        pattern: '^[0-9a-f]{32}-[0-9a-f]{16}$'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Local bearer token of at least 32 bytes
  parameters:
    Query:
      name: q
      in: query
      required: true
      description: AMATL query text, including supported operators
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum entries to return; clamped to 200
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Offset:
      name: offset
      in: query
      required: false
      schema: { type: integer, minimum: 0, default: 0 }
    EntryId:
      name: id
      in: path
      required: true
      schema: { type: integer }
  responses:
    BadRequest:
      description: Invalid query, JSON, or request shape
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Missing or invalid bearer token
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
        WWW-Authenticate:
          schema: { type: string, const: Bearer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Origin is not allowed
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    BodyTooLarge:
      description: Request body exceeds the configured maximum (default 65536 bytes)
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    HeadersTooLarge:
      description: Aggregate request headers exceed the configured maximum (default 16384 bytes)
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RateLimited:
      description: Per-process socket-IP rate limit exceeded
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
        Retry-After:
          schema: { type: string, const: '60' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: The addressed entry does not exist
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    StorageUnavailable:
      description: Local persistence is disabled or unusable
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ServiceUnavailable:
      description: Planning or service configuration failure
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RequestTimeout:
      description: Configured request deadline expired (default 30000 ms)
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    SchemaVersion:
      type: string
      const: '1'
    QueryInput:
      type: object
      required: [q]
      properties:
        q:
          type: string
          minLength: 1
          maxLength: 2048
        page:
          type: integer
          minimum: 0
          description: >-
            Zero-based page over the ranked result set. Pagination is
            server-side: page and page_size must be sent together and the
            client must not window the returned array again. Ignored by /deep.
        page_size:
          type: integer
          minimum: 1
          maximum: 100
    HealthResponse:
      type: object
      additionalProperties: false
      required: [schema_version, status]
      properties:
        schema_version: { $ref: '#/components/schemas/SchemaVersion' }
        status: { type: string, const: ok }
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [schema_version, error]
      properties:
        schema_version: { $ref: '#/components/schemas/SchemaVersion' }
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              description: >-
                Shared error catalog (amatl-core/src/errors.rs). Every AMATL
                surface renders the same identifiers.
              enum: [invalid_request, invalid_query, invalid_url, unauthorized, invalid_host, invalid_origin, rate_limited, body_too_large, headers_too_large, request_timeout, not_found, egress_denied, fetch_failed, provider_not_declared, provider_not_registered, provider_not_enabled, provider_not_approved, provider_credential_missing, provider_network_blocked, search_planning_failed, configuration_invalid, inference_unavailable, ranking_backend_unavailable, storage_unavailable, request_cancelled, serialization_failed, internal_error]
            message: { type: string }
    SearchStatus:
      type: string
      enum: [success, partial_success, failure]
    ResultStatus:
      type: string
      enum: [visible, relegated_by_diversity]
    Degradation:
      type: object
      additionalProperties: false
      required: [code, component, message]
      properties:
        code: { type: string }
        component: { type: string }
        message: { type: string }
    CompositeError:
      type: object
      additionalProperties: false
      required: [code, message, providers, recoverable]
      properties:
        code: { type: string }
        message: { type: string }
        providers:
          type: array
          items: { type: string }
        recoverable: { type: boolean }
    SearchResult:
      type: object
      additionalProperties: false
      required: [schema_version, rank, title, original_url, canonical_url, domain, snippet, providers, published_at, status]
      properties:
        schema_version: { $ref: '#/components/schemas/SchemaVersion' }
        rank: { type: integer, minimum: 1 }
        title: { type: [string, 'null'] }
        original_url: { type: string, format: uri }
        canonical_url: { type: string, format: uri }
        domain: { type: string }
        snippet: { type: [string, 'null'] }
        providers:
          type: array
          items: { type: string }
        published_at: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/ResultStatus' }
    SearchResponse:
      type: object
      additionalProperties: false
      required: [schema_version, query, status, results, providers_used, providers_failed, providers_partial, errors, degradations, elapsed_ms]
      properties:
        schema_version: { $ref: '#/components/schemas/SchemaVersion' }
        query: { type: string }
        status: { $ref: '#/components/schemas/SearchStatus' }
        results:
          type: array
          items: { $ref: '#/components/schemas/SearchResult' }
        providers_used:
          type: array
          items: { type: string }
        providers_failed:
          type: array
          items: { type: string }
        providers_partial:
          type: array
          items: { type: string }
        errors:
          type: array
          items: { $ref: '#/components/schemas/CompositeError' }
        degradations:
          type: array
          items: { $ref: '#/components/schemas/Degradation' }
        elapsed_ms: { type: integer, minimum: 0 }
        total_results:
          type: integer
          minimum: 0
          description: Size of the whole ranked set; present only when the request paginated.
        page: { type: integer, minimum: 0 }
        page_size: { type: integer, minimum: 1, maximum: 100 }
    FetchMethod:
      type: string
      description: local is emitted by the CLI-only ingestion contract, not by HTTP Deep
      enum: [http, rendered, local]
    DocumentStatus:
      type: string
      enum: [enriched, superficial, failed]
    Document:
      type: object
      additionalProperties: false
      required: [schema_version, search_result_id, original_url, canonical_url, final_url, content_hash, fetch_method, extractor_used, content_type, size, retrieved_at, status, content, title, author, published_at, metadata]
      properties:
        schema_version: { $ref: '#/components/schemas/SchemaVersion' }
        search_result_id: { type: string }
        original_url: { type: string, format: uri }
        canonical_url: { type: string, format: uri }
        final_url: { type: string, format: uri }
        content_hash: { type: string }
        fetch_method: { $ref: '#/components/schemas/FetchMethod' }
        extractor_used: { type: [string, 'null'] }
        content_type: { type: [string, 'null'] }
        size: { type: integer, minimum: 0 }
        retrieved_at: { type: string }
        status: { $ref: '#/components/schemas/DocumentStatus' }
        content: { type: [string, 'null'] }
        title: { type: [string, 'null'] }
        author: { type: [string, 'null'] }
        published_at: { type: [string, 'null'] }
        metadata:
          type: object
          additionalProperties: { type: string }
    EvidenceStatus:
      type: string
      enum: [complete, partial]
    Evidence:
      type: object
      additionalProperties: false
      required: [schema_version, document_id, status, fact_density, verified_date, metadata_quality, named_entities, citation_count, citation_span, freshness, originality, evidence_score]
      properties:
        schema_version: { $ref: '#/components/schemas/SchemaVersion' }
        document_id: { type: string }
        status: { $ref: '#/components/schemas/EvidenceStatus' }
        fact_density: { type: number, minimum: 0, maximum: 1 }
        verified_date: { type: boolean }
        metadata_quality: { type: number, minimum: 0, maximum: 1 }
        named_entities:
          type: array
          items: { type: string }
        citation_count: { type: integer, minimum: 0 }
        citation_span: { type: number, minimum: 0, maximum: 1 }
        freshness: { type: number, minimum: 0, maximum: 1 }
        originality: { type: number, minimum: 0, maximum: 1 }
        evidence_score: { type: number, minimum: 0, maximum: 1 }
    EvidenceSignal:
      type: string
      enum: [query_match, citation, temporal, numeric]
    EvidenceProvenance:
      type: object
      additionalProperties: false
      required: [schema_version, provenance_id, document_id, original_url, canonical_url, final_url, source_content_hash, extracted_content_hash, fetch_method, extractor_used, retrieved_at, published_at]
      properties:
        schema_version: { $ref: '#/components/schemas/SchemaVersion' }
        provenance_id: { type: string, pattern: '^[0-9a-f]{64}$' }
        document_id: { type: string }
        original_url: { type: string, format: uri }
        canonical_url: { type: string, format: uri }
        final_url: { type: string, format: uri }
        source_content_hash: { type: string }
        extracted_content_hash: { type: [string, 'null'], pattern: '^[0-9a-f]{64}$' }
        fetch_method: { $ref: '#/components/schemas/FetchMethod' }
        extractor_used: { type: [string, 'null'] }
        retrieved_at: { type: string }
        published_at: { type: [string, 'null'] }
    EvidenceFragment:
      type: object
      additionalProperties: false
      required: [schema_version, fragment_id, provenance_id, ordinal, text, start_byte, end_byte, fragment_hash, matched_terms, signals]
      properties:
        schema_version: { $ref: '#/components/schemas/SchemaVersion' }
        fragment_id: { type: string, pattern: '^[0-9a-f]{64}$' }
        provenance_id: { type: string, pattern: '^[0-9a-f]{64}$' }
        ordinal: { type: integer, minimum: 1, maximum: 8 }
        text: { type: string }
        start_byte: { type: integer, minimum: 0 }
        end_byte: { type: integer, minimum: 1 }
        fragment_hash: { type: string, pattern: '^[0-9a-f]{64}$' }
        matched_terms:
          type: array
          items: { type: string }
        signals:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/EvidenceSignal' }
    EvidenceScoreBasis:
      type: object
      additionalProperties: false
      required: [schema_version, fact_density, verified_date, metadata_quality, citation_count, citation_span, freshness, originality]
      properties:
        schema_version: { $ref: '#/components/schemas/SchemaVersion' }
        fact_density: { type: number, minimum: 0, maximum: 1 }
        verified_date: { type: boolean }
        metadata_quality: { type: number, minimum: 0, maximum: 1 }
        citation_count: { type: integer, minimum: 0 }
        citation_span: { type: number, minimum: 0, maximum: 1 }
        freshness: { type: number, minimum: 0, maximum: 1 }
        originality: { type: number, minimum: 0, maximum: 1 }
    EvidenceV2:
      type: object
      additionalProperties: false
      required: [schema_version, evidence_version, document_id, status, provenance, fragments, score_basis, evidence_score]
      properties:
        schema_version: { $ref: '#/components/schemas/SchemaVersion' }
        evidence_version: { type: string, enum: [v2] }
        document_id: { type: string }
        status: { $ref: '#/components/schemas/EvidenceStatus' }
        provenance: { $ref: '#/components/schemas/EvidenceProvenance' }
        fragments:
          type: array
          maxItems: 8
          items: { $ref: '#/components/schemas/EvidenceFragment' }
        score_basis: { $ref: '#/components/schemas/EvidenceScoreBasis' }
        evidence_score: { type: number, minimum: 0, maximum: 1 }
    RankingV2Status:
      type: string
      enum: [applied, disabled, benchmark_rejected, insufficient_documents]
    DeepRankingExplanation:
      type: object
      additionalProperties: false
      required: [ranking_policy, bm25, semantic, reranker, relevance_score, evidence_score, final_score]
      properties:
        ranking_policy: { type: string }
        bm25: { type: number, minimum: 0, maximum: 1 }
        semantic: { type: [number, 'null'], minimum: 0, maximum: 1 }
        reranker: { type: [number, 'null'], minimum: 0, maximum: 1 }
        relevance_score: { type: number, minimum: 0, maximum: 1 }
        evidence_score: { type: number, minimum: 0, maximum: 1 }
        final_score: { type: number, minimum: 0, maximum: 1 }
    DeepRankedDocument:
      type: object
      additionalProperties: false
      required: [document_id, rank, original_rank, relevance_score, evidence_score, final_score, explanation]
      properties:
        document_id: { type: string }
        rank: { type: integer, minimum: 1 }
        original_rank: { type: integer, minimum: 1 }
        relevance_score: { type: number, minimum: 0, maximum: 1 }
        evidence_score: { type: number, minimum: 0, maximum: 1 }
        final_score: { type: number, minimum: 0, maximum: 1 }
        explanation: { $ref: '#/components/schemas/DeepRankingExplanation' }
    RankingV2Output:
      type: object
      additionalProperties: false
      required: [schema_version, policy_version, benchmark_id, status, results]
      properties:
        schema_version: { $ref: '#/components/schemas/SchemaVersion' }
        policy_version: { type: string }
        benchmark_id: { type: string }
        status: { $ref: '#/components/schemas/RankingV2Status' }
        results:
          type: array
          items: { $ref: '#/components/schemas/DeepRankedDocument' }
    GapType:
      type: string
      enum: [primary_source, recency, geographic_diversity, documentation, pdf, code, specification, source_diversity]
    GapSeverity:
      type: string
      enum: [low, medium, high]
    Gap:
      type: object
      additionalProperties: false
      required: [schema_version, gap_type, severity, reason, recommended_query, estimated_cost, expected_gain, status]
      properties:
        schema_version: { $ref: '#/components/schemas/SchemaVersion' }
        gap_type: { $ref: '#/components/schemas/GapType' }
        severity: { $ref: '#/components/schemas/GapSeverity' }
        reason: { type: string }
        recommended_query: { type: [string, 'null'] }
        estimated_cost: { type: [integer, 'null'], minimum: 0 }
        expected_gain: { type: [integer, 'null'], minimum: 0 }
        status: { type: string, const: detected }
    SubQueryStatus:
      type: string
      enum: [proposed, executed, failed, rejected_budget, invalid]
    SubQuery:
      type: object
      additionalProperties: false
      required: [schema_version, raw_query, reason, gap_type, estimated_cost, expected_gain, actual_gain, status, results, errors]
      properties:
        schema_version: { $ref: '#/components/schemas/SchemaVersion' }
        raw_query: { type: string }
        reason: { type: string }
        gap_type: { $ref: '#/components/schemas/GapType' }
        estimated_cost: { type: integer, minimum: 0 }
        expected_gain: { type: integer, minimum: 0 }
        actual_gain: { type: integer, minimum: 0 }
        status: { $ref: '#/components/schemas/SubQueryStatus' }
        results:
          type: array
          items: { $ref: '#/components/schemas/SearchResult' }
        errors:
          type: array
          items: { $ref: '#/components/schemas/CompositeError' }
    DeepResponse:
      type: object
      additionalProperties: false
      required: [schema_version, query, documents, errors, degradations, evidence, evidence_v2, ranking_v2, gaps, subqueries, elapsed_ms]
      properties:
        schema_version: { $ref: '#/components/schemas/SchemaVersion' }
        query: { type: string }
        documents:
          type: array
          items: { $ref: '#/components/schemas/Document' }
        errors:
          type: array
          items: { $ref: '#/components/schemas/CompositeError' }
        degradations:
          type: array
          items: { $ref: '#/components/schemas/Degradation' }
        evidence:
          type: array
          items: { $ref: '#/components/schemas/Evidence' }
        evidence_v2:
          type: array
          items: { $ref: '#/components/schemas/EvidenceV2' }
        ranking_v2: { $ref: '#/components/schemas/RankingV2Output' }
        gaps:
          type: array
          items: { $ref: '#/components/schemas/Gap' }
        subqueries:
          type: array
          items: { $ref: '#/components/schemas/SubQuery' }
        elapsed_ms: { type: integer, minimum: 0 }
    ProviderSurfaceStatus:
      type: string
      enum: [available, unavailable]
    ProviderCapabilities:
      type: object
      additionalProperties: false
      required: [schema_version, pagination, language, region, time_range, site_filter, file_filter, news, code, docs, academic, authentication, estimated_cost]
      properties:
        schema_version: { $ref: '#/components/schemas/SchemaVersion' }
        pagination: { type: boolean }
        language: { type: boolean }
        region: { type: boolean }
        time_range: { type: boolean }
        site_filter: { type: boolean }
        file_filter: { type: boolean }
        news: { type: boolean }
        code: { type: boolean }
        docs: { type: boolean }
        academic: { type: boolean }
        authentication: { type: boolean }
        estimated_cost: { type: [integer, 'null'], minimum: 0 }
    ProviderSummary:
      type: object
      additionalProperties: false
      required: [schema_version, name, status, code, capabilities]
      properties:
        schema_version: { $ref: '#/components/schemas/SchemaVersion' }
        name: { type: string }
        status: { $ref: '#/components/schemas/ProviderSurfaceStatus' }
        code: { type: [string, 'null'] }
        capabilities: { $ref: '#/components/schemas/ProviderCapabilities' }
    ProviderResponse:
      type: object
      additionalProperties: false
      required: [schema_version, providers]
      properties:
        schema_version: { $ref: '#/components/schemas/SchemaVersion' }
        providers:
          type: array
          items: { $ref: '#/components/schemas/ProviderSummary' }
    CircuitState:
      type: string
      description: Persistent breaker state for one source.
      enum: [closed, open, half_open]
    SourceStatus:
      type: object
      additionalProperties: false
      required: [name, status, code, circuit, success_rate, average_latency_ms, observations]
      properties:
        name: { type: string }
        status: { $ref: '#/components/schemas/ProviderSurfaceStatus' }
        code: { type: [string, 'null'] }
        circuit: { $ref: '#/components/schemas/CircuitState' }
        success_rate: { type: [number, 'null'], minimum: 0, maximum: 1 }
        average_latency_ms: { type: [number, 'null'], minimum: 0 }
        observations: { type: integer, minimum: 0 }
    StorageStatus:
      type: object
      additionalProperties: false
      required: [enabled, available, migration_version, history_entries, saved_documents, message]
      properties:
        enabled: { type: boolean }
        available: { type: boolean }
        migration_version: { type: [integer, 'null'] }
        history_entries: { type: [integer, 'null'] }
        saved_documents: { type: [integer, 'null'] }
        message: { type: [string, 'null'] }
    CacheStatus:
      type: object
      additionalProperties: false
      required:
        - provider_search_enabled
        - document_enabled
        - provider_search_entries
        - provider_search_bytes
        - document_entries
        - document_bytes
        - provider_search_hits
        - provider_search_misses
        - provider_search_hit_rate
        - document_hits
        - document_misses
        - document_hit_rate
      properties:
        provider_search_enabled: { type: boolean }
        document_enabled: { type: boolean }
        provider_search_entries: { type: integer, minimum: 0 }
        provider_search_bytes: { type: integer, minimum: 0 }
        document_entries: { type: integer, minimum: 0 }
        document_bytes: { type: integer, minimum: 0 }
        provider_search_hits: { type: integer, minimum: 0 }
        provider_search_misses: { type: integer, minimum: 0 }
        provider_search_hit_rate: { type: number, minimum: 0, maximum: 1 }
        document_hits: { type: integer, minimum: 0 }
        document_misses: { type: integer, minimum: 0 }
        document_hit_rate: { type: number, minimum: 0, maximum: 1 }
    ServiceStatus:
      type: object
      additionalProperties: false
      required: [schema_version, status, sources, storage, cache, inference_backend]
      properties:
        schema_version: { $ref: '#/components/schemas/SchemaVersion' }
        status: { type: string, enum: [ok, degraded] }
        sources:
          type: array
          items: { $ref: '#/components/schemas/SourceStatus' }
        storage: { $ref: '#/components/schemas/StorageStatus' }
        cache: { $ref: '#/components/schemas/CacheStatus' }
        inference_backend: { type: [string, 'null'] }
    SearchHistoryEntry:
      type: object
      additionalProperties: false
      required: [id, normalized_query, raw_query, category, provider_count, total_results, deep_fetches, created_at, surface]
      properties:
        id: { type: integer }
        normalized_query: { type: string }
        raw_query: { type: string }
        category: { type: [string, 'null'] }
        provider_count: { type: integer, minimum: 0 }
        total_results: { type: integer, minimum: 0 }
        deep_fetches: { type: integer, minimum: 0 }
        created_at: { type: integer, description: Unix seconds }
        surface: { type: string, enum: [cli, api, mcp] }
    HistoryResponse:
      type: object
      additionalProperties: false
      required: [schema_version, entries]
      properties:
        schema_version: { $ref: '#/components/schemas/SchemaVersion' }
        entries:
          type: array
          items: { $ref: '#/components/schemas/SearchHistoryEntry' }
    SavedDocument:
      type: object
      additionalProperties: false
      required: [id, canonical_url, title, snippet, content_hash, extractor_version, payload, size_bytes, saved_at, source_query, tags]
      properties:
        id: { type: integer }
        canonical_url: { type: string, format: uri }
        title: { type: [string, 'null'] }
        snippet: { type: [string, 'null'] }
        content_hash: { type: string, pattern: '^[0-9a-fA-F]{64}$' }
        extractor_version: { type: string }
        payload: { type: string }
        size_bytes: { type: integer, minimum: 0 }
        saved_at: { type: integer, description: Unix seconds }
        source_query: { type: [string, 'null'] }
        tags: { type: string, description: Comma-separated tag list }
    SavedDocumentsResponse:
      type: object
      additionalProperties: false
      required: [schema_version, documents]
      properties:
        schema_version: { $ref: '#/components/schemas/SchemaVersion' }
        documents:
          type: array
          items: { $ref: '#/components/schemas/SavedDocument' }
    SaveDocumentInput:
      type: object
      additionalProperties: false
      required: [canonical_url, content_hash, extractor_version, payload]
      properties:
        canonical_url: { type: string, format: uri, description: Public http(s) URL }
        title: { type: [string, 'null'] }
        snippet: { type: [string, 'null'] }
        content_hash: { type: string, pattern: '^[0-9a-fA-F]{64}$' }
        extractor_version: { type: string, minLength: 1, maxLength: 128 }
        payload:
          type: string
          description: Bounded by persistence.saved_document_max_bytes (default 1 MiB)
        source_query: { type: [string, 'null'] }
        tags:
          type: array
          maxItems: 16
          items: { type: string, maxLength: 64 }
    DeletedResponse:
      type: object
      additionalProperties: false
      required: [schema_version, deleted]
      properties:
        schema_version: { $ref: '#/components/schemas/SchemaVersion' }
        deleted: { type: integer, minimum: 0 }
    ReloadReport:
      type: object
      additionalProperties: false
      required: [schema_version, config_file, declared_sources, enabled_sources, registered_sources, inference_backend]
      properties:
        schema_version: { $ref: '#/components/schemas/SchemaVersion' }
        config_file: { type: [string, 'null'] }
        declared_sources:
          type: array
          items: { type: string }
        enabled_sources:
          type: array
          items: { type: string }
        registered_sources:
          type: array
          description: Sources with a registered factory in this process.
          items: { type: string }
        inference_backend: { type: [string, 'null'] }
