name: chromium-isolation

on:
  push:
    paths:
      - packaging/amatl-chromium-sandbox
      - docs/security/chromium-isolation.md
      - .github/workflows/chromium-isolation.yml
  pull_request:
    paths:
      - packaging/amatl-chromium-sandbox
      - docs/security/chromium-isolation.md
      - .github/workflows/chromium-isolation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install Chromium isolation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap util-linux
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Render JavaScript without browser network access
        run: |
          fixture="$(mktemp --suffix=.html)"
          output="$(mktemp --suffix=.html)"
          printf '%s' '<!doctype html><p id="state">before</p><script>document.querySelector("#state").textContent="rendered"</script>' > "$fixture"
          packaging/amatl-chromium-sandbox "$fixture" "$output" 20
          grep --fixed-strings --quiet '>rendered<' "$output"
      - name: Prove loopback is unreachable from the browser namespace
        run: |
          fixture="$(mktemp --suffix=.html)"
          output="$(mktemp --suffix=.html)"
          printf '%s' '<!doctype html><p id="state">pending</p><script>fetch("http://127.0.0.1:8765/").then(()=>state.textContent="network-leak").catch(()=>state.textContent="blocked")</script>' > "$fixture"
          packaging/amatl-chromium-sandbox "$fixture" "$output" 20
          grep --fixed-strings --quiet '>blocked<' "$output"
