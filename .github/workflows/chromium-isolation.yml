name: chromium-isolation

on:
  push:
    paths:
      - packaging/amatl-chromium-sandbox
      - docs/security/chromium-isolation.md
      - .github/workflows/chromium-isolation.yml
      # The isolation contract is only meaningful together with the code that
      # owns rendering and network egress; a change there must re-run it.
      - crates/amatl-core/src/render.rs
      - crates/amatl-core/src/fetch.rs
  pull_request:
    paths:
      - packaging/amatl-chromium-sandbox
      - docs/security/chromium-isolation.md
      - .github/workflows/chromium-isolation.yml
      # The isolation contract is only meaningful together with the code that
      # owns rendering and network egress; a change there must re-run it.
      - crates/amatl-core/src/render.rs
      - crates/amatl-core/src/fetch.rs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-render:
    # Pinned on purpose. `ubuntu-latest` moved to the ubuntu-26.04 image
    # (release 20261111.82), whose AppArmor policy denies the unprivileged user
    # namespace Chromium's zygote needs: the gate went red on 2026-11-13, days
    # after that migration, with nothing in the repository changed. The levers
    # below relax the sysctl and drop the per-binary profile, which is enough on
    # 22.04 and is not enough on 26.04. Pin the image that the isolation
    # contract is known to hold on; moving it is a deliberate change, not a
    # silent one.
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install Chromium isolation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap curl unzip apparmor-utils
          # Ubuntu 23.10+ ships an AppArmor profile that removes the
          # `userns` permission from unprivileged binaries, and Chromium's
          # zygote therefore cannot create its sandbox:
          #   "No usable sandbox! ... disabled unprivileged user namespaces"
          # The gate below is fail-closed on purpose — it must prove the
          # sandbox works, not pass by disabling it. That leaves two levers,
          # and both are applied: the effective sysctl (when the key exists)
          # and the per-binary profile, which Ubuntu loads dynamically and which
          # survives the sysctl on its own.
          #
          # Neither step may fail silently: the previous version ran
          # `sudo sysctl --write …=0` under `if`, so a rejected write printed
          # nothing and the failure surfaced 40 steps later as a bare
          # "isolated Chromium failed".
          if [ -w /proc/sys/kernel/apparmor_restrict_unprivileged_userns ] \
             || [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            echo "kernel.apparmor_restrict_unprivileged_userns is exposed; relaxing it"
            sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
          else
            echo "kernel.apparmor_restrict_unprivileged_userns is not exposed; checking profiles"
          fi
          # The per-binary profile is what actually blocks the zygote on current
          # runners: `userns` is denied inside the profile, not by the sysctl.
          if command -v aa-status >/dev/null 2>&1; then
            sudo aa-status --profiled | grep --extended-regexp '(^|/)(chrome|chromium)(-|$)' \
              && echo "an AppArmor profile covers Chrome; it is removed below" \
              || echo "no AppArmor profile covers Chrome"
          fi
          for profile in chrome chromium; do
            if [ -e "/etc/apparmor.d/$profile" ]; then
              sudo apparmor_parser --remove "/etc/apparmor.d/$profile" \
                || echo "warning: could not unload the $profile profile" >&2
            fi
          done
          # Prove the precondition before spending the job: an unprivileged
          # user namespace must be creatable, which is what the zygote needs.
          sudo sysctl --write kernel.unprivileged_userns_clone=1 >/dev/null 2>&1 || true
          unshare --user --map-root-user --mount true \
            && echo "unprivileged user namespaces are available" \
            || { echo "unprivileged user namespaces are unavailable; the gate cannot run" >&2; exit 1; }
          archive="$(mktemp --suffix=.zip)"
          curl --fail --location --silent --show-error \
            https://storage.googleapis.com/chrome-for-testing-public/152.0.7977.42/linux64/chrome-headless-shell-linux64.zip \
            --output "$archive"
          printf '%s  %s\n' \
            129686a270d84ac4637c614802c554634aa827aa13214216f81e0a0b9410f8cf \
            "$archive" | sha256sum --check --status
          sudo install --directory --mode 0755 /opt/amatl-chromium
          sudo unzip -q "$archive" -d /opt/amatl-chromium
          echo 'AMATL_CHROMIUM_BIN=/opt/amatl-chromium/chrome-headless-shell-linux64/chrome-headless-shell' >> "$GITHUB_ENV"
      - name: Bring up a user systemd instance for systemd-run --user
        # The sandbox wraps Chromium in `systemd-run --user`, which needs a
        # per-user manager and session bus. GitHub runners do not start one for
        # the job user by default, which makes the isolation steps fail
        # intermittently ("Failed to connect to the bus"). Enable lingering so
        # the manager comes up and export the runtime dir the rest of the job
        # (and the sandbox script) rely on.
        run: |
          uid="$(id -u)"
          sudo loginctl enable-linger "$USER"
          for _ in $(seq 1 30); do
            if systemctl --user is-system-running >/dev/null 2>&1 \
              || [ -S "/run/user/$uid/bus" ]; then
              break
            fi
            sleep 1
          done
          [ -S "/run/user/$uid/bus" ]
          {
            echo "XDG_RUNTIME_DIR=/run/user/$uid"
            echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$uid/bus"
          } >> "$GITHUB_ENV"
          systemd-run --user --wait --collect --pipe --quiet --unit amatl-userbus-probe -- true
      - name: Verify runner Chromium baseline
        run: |
          chromium="$AMATL_CHROMIUM_BIN"
          "$chromium" --version
          fixture="$(mktemp --suffix=.html)"
          printf '%s' '<!doctype html><p id="state">baseline</p>' > "$fixture"
          timeout 45 "$chromium" --headless=new --no-sandbox --disable-gpu \
            --dump-dom "file://$fixture" | grep --fixed-strings --quiet '>baseline<'
      - name: Render JavaScript without browser network access
        run: |
          fixture="$(mktemp --suffix=.html)"
          output="$(mktemp --suffix=.html)"
          printf '%s' '<!doctype html><p id="state">before</p><script>document.querySelector("#state").textContent="rendered"</script>' > "$fixture"
          packaging/amatl-chromium-sandbox "$fixture" "$output" 60
          grep --fixed-strings --quiet '>rendered<' "$output"
      - name: Prove loopback is unreachable from the browser namespace
        run: |
          fixture="$(mktemp --suffix=.html)"
          output="$(mktemp --suffix=.html)"
          # A *synchronous* XHR so the network attempt and its failure are
          # resolved inside this one script execution, before --dump-dom
          # snapshots the DOM. An async fet().catch() left the assertion racing
          # the snapshot ("pending" leaked through intermittently).
          printf '%s' '<!doctype html><p id="state">pending</p><script>try{var x=new XMLHttpRequest();x.open("GET","http://127.0.0.1:8765/",false);x.send();document.querySelector("#state").textContent="network-leak"}catch(e){document.querySelector("#state").textContent="blocked"}</script>' > "$fixture"
          packaging/amatl-chromium-sandbox "$fixture" "$output" 60
          grep --fixed-strings --quiet '>blocked<' "$output"
      - name: Prove the browser does not inherit the service environment
        # Chromium has no API to read its own environment, so the proof swaps
        # in a stand-in "Chromium" that dumps `env` to stdout — which the
        # harness captures as the DOM. The harness accepts any executable under
        # /usr or /opt, so this drives the real `--clearenv` path rather than a
        # reimplementation of it.
        env:
          AMATL_CHROMIUM_BIN: /opt/amatl-env-probe/chromium
          AMATL_ENV_PROBE_CANARY: service-environment-canary
        run: |
          sudo install --directory --mode 0755 /opt/amatl-env-probe
          printf '%s\n' '#!/bin/sh' '/usr/bin/env' \
            | sudo tee /opt/amatl-env-probe/chromium >/dev/null
          sudo chmod 0755 /opt/amatl-env-probe/chromium
          fixture="$(mktemp --suffix=.html)"
          output="$(mktemp --suffix=.html)"
          printf '%s' '<!doctype html><p>probe</p>' > "$fixture"
          packaging/amatl-chromium-sandbox "$fixture" "$output" 60
          if grep --fixed-strings --quiet 'AMATL_ENV_PROBE_CANARY' "$output"; then
            echo "the sandboxed browser inherited the service environment" >&2
            exit 1
          fi
          # `--clearenv` must clear what the harness did not set, and only that.
          grep --fixed-strings --quiet 'HOME=/tmp/home' "$output"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Drive the harness through ChromiumRenderer
        # The shell steps above prove the harness itself confines Chromium.
        # This proves the Rust backend actually reaches it, that scripts run,
        # and that a rendered page still cannot open a loopback connection.
        env:
          AMATL_CHROMIUM_INTEGRATION: "1"
        run: cargo test --locked -p amatl-core --test deep_phase5 -- --test-threads=1
