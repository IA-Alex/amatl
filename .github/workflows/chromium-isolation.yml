name: chromium-isolation

on:
  push:
    paths:
      - packaging/amatl-chromium-sandbox
      - docs/security/chromium-isolation.md
      - .github/workflows/chromium-isolation.yml
      # The isolation contract is only meaningful together with the code that
      # owns rendering and network egress; a change there must re-run it.
      - crates/amatl-core/src/render.rs
      - crates/amatl-core/src/fetch.rs
  pull_request:
    paths:
      - packaging/amatl-chromium-sandbox
      - docs/security/chromium-isolation.md
      - .github/workflows/chromium-isolation.yml
      # The isolation contract is only meaningful together with the code that
      # owns rendering and network egress; a change there must re-run it.
      - crates/amatl-core/src/render.rs
      - crates/amatl-core/src/fetch.rs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install Chromium isolation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap curl unzip
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
          fi
          archive="$(mktemp --suffix=.zip)"
          curl --fail --location --silent --show-error \
            https://storage.googleapis.com/chrome-for-testing-public/152.0.7977.42/linux64/chrome-headless-shell-linux64.zip \
            --output "$archive"
          printf '%s  %s\n' \
            129686a270d84ac4637c614802c554634aa827aa13214216f81e0a0b9410f8cf \
            "$archive" | sha256sum --check --status
          sudo install --directory --mode 0755 /opt/amatl-chromium
          sudo unzip -q "$archive" -d /opt/amatl-chromium
          echo 'AMATL_CHROMIUM_BIN=/opt/amatl-chromium/chrome-headless-shell-linux64/chrome-headless-shell' >> "$GITHUB_ENV"
      - name: Verify runner Chromium baseline
        run: |
          chromium="$AMATL_CHROMIUM_BIN"
          "$chromium" --version
          fixture="$(mktemp --suffix=.html)"
          printf '%s' '<!doctype html><p id="state">baseline</p>' > "$fixture"
          timeout 45 "$chromium" --headless=new --no-sandbox --disable-gpu \
            --dump-dom "file://$fixture" | grep --fixed-strings --quiet '>baseline<'
      - name: Render JavaScript without browser network access
        run: |
          fixture="$(mktemp --suffix=.html)"
          output="$(mktemp --suffix=.html)"
          printf '%s' '<!doctype html><p id="state">before</p><script>document.querySelector("#state").textContent="rendered"</script>' > "$fixture"
          packaging/amatl-chromium-sandbox "$fixture" "$output" 60
          grep --fixed-strings --quiet '>rendered<' "$output"
      - name: Prove loopback is unreachable from the browser namespace
        run: |
          fixture="$(mktemp --suffix=.html)"
          output="$(mktemp --suffix=.html)"
          printf '%s' '<!doctype html><p id="state">pending</p><script>fetch("http://127.0.0.1:8765/").then(()=>state.textContent="network-leak").catch(()=>state.textContent="blocked")</script>' > "$fixture"
          packaging/amatl-chromium-sandbox "$fixture" "$output" 60
          grep --fixed-strings --quiet '>blocked<' "$output"
