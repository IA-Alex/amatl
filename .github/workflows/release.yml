name: release-candidate

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release.yml
      - packaging/**
    tags:
      - "v*-rc.*"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2.82.0
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.18.7
          fallback: none
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo check --workspace --benches --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Ranking v2 quality gate
        run: cargo run --locked --quiet -p amatl-cli -- benchmark ranking-v2 --json
      - run: cargo audit
      - run: cargo deny check
      - name: Verify minimum supported Rust version
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          cargo +1.88.0 check --workspace --all-targets --locked

  linux-x86_64-musl:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2.82.0
        with:
          tool: cargo-cyclonedx@0.5.9
          fallback: none
      - name: Install Linux build and packaging tools
        run: sudo apt-get update && sudo apt-get install --yes musl-tools rpm zstd
      - name: Validate release version
        id: version
        run: |
          package_version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "amatl-cli") | .version')"
          test -n "$package_version"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$package_version" ]]; then
            echo "tag $GITHUB_REF_NAME does not match package version $package_version" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$(git cat-file -t "$GITHUB_REF_NAME")" != "tag" ]]; then
            echo "release-candidate tags must be annotated" >&2
            exit 1
          fi
          echo "package_version=$package_version" >> "$GITHUB_OUTPUT"
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - name: Build static Linux binary (x86_64)
        run: cargo build --locked --release --target x86_64-unknown-linux-musl -p amatl-cli
      - name: Verify static Linux binary
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
        run: |
          binary="target/x86_64-unknown-linux-musl/release/amatl"
          file "$binary"
          file "$binary" | grep --extended-regexp --quiet 'static(-pie|ally) linked'
          "$binary" --version | grep --fixed-strings --quiet "amatl $PACKAGE_VERSION"
      - name: Generate CycloneDX SBOMs
        run: cargo cyclonedx --target x86_64-unknown-linux-musl --target-in-filename
      - name: Package reproducible archive and checksums
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
        run: |
          archive_root="amatl-${PACKAGE_VERSION}-x86_64-unknown-linux-musl"
          mkdir -p "dist/$archive_root/sbom"
          install -m 0755 "target/x86_64-unknown-linux-musl/release/amatl" "dist/$archive_root/amatl"
          install -m 0644 README.md LICENSE-MIT LICENSE-APACHE "dist/$archive_root/"
          while IFS= read -r sbom; do
            crate="$(basename "$(dirname "$sbom")")"
            install -m 0644 "$sbom" "dist/$archive_root/sbom/${crate}.cdx.xml"
          done < <(find crates -mindepth 2 -maxdepth 2 -name '*.cdx.xml' -print | sort)
          test "$(find "dist/$archive_root/sbom" -name '*.cdx.xml' | wc -l)" -eq 4
          tar --sort=name --owner=0 --group=0 --numeric-owner \
            --mtime="@$SOURCE_DATE_EPOCH" -C dist -czf "dist/$archive_root.tar.gz" "$archive_root"
          rm -r "dist/$archive_root"
          packaging/build-linux-packages.sh \
            "target/x86_64-unknown-linux-musl/release/amatl" \
            "$PACKAGE_VERSION" x86_64 dist
          cd dist
          sha256sum *.tar.gz *.deb *.rpm *.pkg.tar.zst > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Smoke-test Linux packages (.deb, .rpm, .pkg.tar.zst)
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
        run: |
          set -euo pipefail
          cd dist

          # --- .deb ---
          echo "::group::Smoke-test .deb"
          sudo dpkg -i amatl_*.deb
          amatl --version | grep --fixed-strings --quiet "amatl $PACKAGE_VERSION"
          echo ".deb installed and executes correctly"
          sudo dpkg --purge amatl
          echo "::endgroup::"

          # --- .rpm ---
          echo "::group::Smoke-test .rpm"
          sudo rpm -i amatl-*.rpm 2>/dev/null || sudo rpm -i --nodeps amatl-*.rpm
          amatl --version | grep --fixed-strings --quiet "amatl $PACKAGE_VERSION"
          echo ".rpm installed and executes correctly"
          sudo rpm -e amatl
          echo "::endgroup::"

          # --- .pkg.tar.zst (Arch) ---
          echo "::group::Smoke-test .pkg.tar.zst"
          # pacman needs an Arch-like environment; install via bsdtar + manual check
          mkdir -p /tmp/amatl-arch-test
          bsdtar -xf amatl-*.pkg.tar.zst -C /tmp/amatl-arch-test
          /tmp/amatl-arch-test/usr/bin/amatl --version | grep --fixed-strings --quiet "amatl $PACKAGE_VERSION"
          echo ".pkg.tar.zst extracted and executes correctly"
          rm -rf /tmp/amatl-arch-test
          echo "::endgroup::"
      - name: Attest artifacts when GitHub supports the repository visibility
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/SHA256SUMS
      - name: Record unavailable private-repository attestation
        if: github.event.repository.visibility != 'public'
        run: >-
          echo 'Artifact attestation is unavailable for this user-owned private repository;
          SHA-256 checksums and CycloneDX SBOMs remain included.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        with:
          name: amatl-${{ steps.version.outputs.package_version }}-x86_64-unknown-linux-musl
          retention-days: 30
          path: dist/*
          if-no-files-found: error
      - name: Publish prerelease from annotated tag
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --verify-tag --prerelease --generate-notes

  linux-aarch64-musl:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Install cross-compilation toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools gcc-aarch64-linux-gnu
      - name: Validate release version
        id: version
        run: |
          package_version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "amatl-cli") | .version')"
          test -n "$package_version"
          echo "package_version=$package_version" >> "$GITHUB_OUTPUT"
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - name: Build static Linux binary (aarch64)
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_musl: aarch64-linux-gnu-gcc
        run: cargo build --locked --release --target aarch64-unknown-linux-musl -p amatl-cli
      - name: Package aarch64 archive
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
        run: |
          archive_root="amatl-${PACKAGE_VERSION}-aarch64-unknown-linux-musl"
          mkdir -p "dist/$archive_root"
          install -m 0755 "target/aarch64-unknown-linux-musl/release/amatl" "dist/$archive_root/amatl"
          install -m 0644 README.md LICENSE-MIT LICENSE-APACHE "dist/$archive_root/"
          tar --sort=name --owner=0 --group=0 --numeric-owner \
            --mtime="@$SOURCE_DATE_EPOCH" -C dist -czf "dist/$archive_root.tar.gz" "$archive_root"
          rm -r "dist/$archive_root"
          cd dist
          sha256sum "$archive_root.tar.gz" > "SHA256SUMS-aarch64"
      - uses: actions/upload-artifact@v6
        with:
          name: amatl-${{ steps.version.outputs.package_version }}-aarch64-unknown-linux-musl
          retention-days: 30
          path: dist/*
          if-no-files-found: error
      - name: Publish prerelease from annotated tag
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "$GITHUB_REF_NAME" dist/*
          --clobber

  macos:
    needs: quality
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: write
    strategy:
      matrix:
        target:
          - x86_64-apple-darwin
          - aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Validate release version
        id: version
        run: |
          package_version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "amatl-cli") | .version')"
          test -n "$package_version"
          echo "package_version=$package_version" >> "$GITHUB_OUTPUT"
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - name: Build macOS binary
        run: cargo build --locked --release --target ${{ matrix.target }} -p amatl-cli
      - name: Verify macOS binary
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
        run: |
          binary="target/${{ matrix.target }}/release/amatl"
          file "$binary"
          "$binary" --version | grep --fixed-strings --quiet "amatl $PACKAGE_VERSION"
      - name: Package macOS archive
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
        run: |
          archive_root="amatl-${PACKAGE_VERSION}-${{ matrix.target }}"
          mkdir -p "dist/$archive_root"
          install -m 0755 "target/${{ matrix.target }}/release/amatl" "dist/$archive_root/amatl"
          install -m 0644 README.md LICENSE-MIT LICENSE-APACHE "dist/$archive_root/"
          tar --sort=name --owner=0 --group=0 --numeric-owner \
            --mtime="@$SOURCE_DATE_EPOCH" -C dist -czf "dist/$archive_root.tar.gz" "$archive_root"
          rm -r "dist/$archive_root"
          cd dist
          shasum -a 256 "$archive_root.tar.gz" > "SHA256SUMS-${{ matrix.target }}"
      - uses: actions/upload-artifact@v6
        with:
          name: amatl-${{ steps.version.outputs.package_version }}-${{ matrix.target }}
          retention-days: 30
          path: dist/*
          if-no-files-found: error
      - name: Publish prerelease from annotated tag
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "$GITHUB_REF_NAME" dist/*
          --clobber

  windows:
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Validate release version
        id: version
        shell: bash
        run: |
          package_version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "amatl-cli") | .version')"
          test -n "$package_version"
          echo "package_version=$package_version" >> "$GITHUB_OUTPUT"
      - name: Build Windows binary
        run: cargo build --locked --release -p amatl-cli
      - name: Verify Windows binary
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
        run: |
          binary="target/release/amatl.exe"
          file "$binary" || true
          "$binary" --version | grep --fixed-strings --quiet "amatl $PACKAGE_VERSION"
      - name: Package Windows archive
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
        run: |
          archive_root="amatl-${PACKAGE_VERSION}-x86_64-pc-windows-msvc"
          mkdir -p "dist/$archive_root"
          cp "target/release/amatl.exe" "dist/$archive_root/amatl.exe"
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/$archive_root/"
          cd dist
          zip -r "$archive_root.zip" "$archive_root"
          rm -r "$archive_root"
          sha256sum "$archive_root.zip" > "SHA256SUMS-windows"
      - uses: actions/upload-artifact@v6
        with:
          name: amatl-${{ steps.version.outputs.package_version }}-x86_64-pc-windows-msvc
          retention-days: 30
          path: dist/*
          if-no-files-found: error
      - name: Publish prerelease from annotated tag
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "$GITHUB_REF_NAME" dist/*
          --clobber
