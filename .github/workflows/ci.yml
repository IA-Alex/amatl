name: contract-gate

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: contract-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2.82.0
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.18.7,cargo-cyclonedx@0.5.9
          fallback: none
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo check --workspace --benches --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Executable quality gate: the CLI exits non-zero when Ranking v2 stops
      # beating its baseline on the shipped labeled corpus.
      - name: Ranking v2 quality gate
        run: cargo run --locked --quiet -p amatl-cli -- benchmark ranking-v2 --json
      - run: cargo audit
      - run: cargo deny check
      - run: cargo cyclonedx
      - uses: actions/upload-artifact@v6
        with:
          name: amatl-sbom
          retention-days: 14
          path: |
            **/*.cdx.json
            **/*.cdx.xml
          if-no-files-found: error

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked

  cross-platform:
    # Release publishes macOS and Windows archives, so the workspace must keep
    # compiling and passing tests on those hosts on every push, not only at tag
    # time. Linux-only capabilities (Chromium sandbox, Debian packaging) stay
    # out of this job by construction.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  trafilatura-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install pinned Trafilatura capability
        run: python3 -m pip install --disable-pip-version-check trafilatura==2.2.0
      - name: Verify the real extractor contract
        env:
          AMATL_TRAFILATURA_INTEGRATION: "1"
        run: cargo test --locked -p amatl-core --test trafilatura_integration
