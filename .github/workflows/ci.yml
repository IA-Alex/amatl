name: contract-gate

on:
  push:
  pull_request:
  schedule:
    # Nightly, for the long-running jobs excluded from the per-push gate.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contract-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2.82.0
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.18.7,cargo-cyclonedx@0.5.9
          fallback: none
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo check --workspace --benches --locked
      # `--all-features` so the gate covers exactly what is verified locally.
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # The workspace exposes a large public API that ships to docs.rs; broken
      # intra-doc links would otherwise only surface after publishing.
      - name: Documentation builds without warnings
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked
      # Executable quality gate: the CLI exits non-zero when Ranking v2 stops
      # beating its baseline on the shipped labeled corpus.
      - name: Ranking v2 quality gate
        run: cargo run --locked --quiet -p amatl-cli -- benchmark ranking-v2 --json
      - run: ./scripts/security-gate.sh --expected-ignore RUSTSEC-2026-0459 --expected-ignore RUSTSEC-2026-0543
      - run: cargo cyclonedx
      - uses: actions/upload-artifact@v6
        with:
          name: amatl-sbom
          retention-days: 14
          path: |
            **/*.cdx.json
            **/*.cdx.xml
          if-no-files-found: error

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked

  cross-platform:
    # Release publishes macOS archives, so the workspace must keep compiling and
    # passing tests there on every push, not only at tag time. Linux-only
    # capabilities (Chromium sandbox, Debian packaging) stay out of this job by
    # construction.
    #
    # Windows is not in this matrix because it is not a published target: the
    # workspace spawns POSIX programs (`/bin/sh`, Trafilatura, `pdftotext`) and
    # its tests exercise that contract directly, so a Windows job could only
    # pass by asserting less than the product does.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  soak:
    # The soak test is `#[ignore]`d because it runs for ~30 s and opens many
    # sockets, which does not belong in the per-push gate. Without a scheduled
    # job it never ran at all.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p amatl-server --test soak -- --ignored --nocapture

  browser-e2e:
    # The UI's behaviour lives in 32 KB of vanilla JavaScript, so it is only
    # observable in a real browser. The tests only run with AMATL_BROWSER_E2E=1,
    # which keeps a driver-less checkout green; once opted in they are
    # fail-closed, so a missing or version-mismatched driver fails the job
    # instead of skipping green (the trap that a stale local chromedriver sets).
    # `setup-chrome` installs Chrome and a matching chromedriver, but chromedriver
    # discovers the browser through the platform's default path — the runner's
    # *preinstalled* Chrome, not the one the action installed. With the action's
    # driver (158) against that preinstalled Chrome (157) the fail-closed suite
    # reported "only supports Chrome version 158" for a job that never launched a
    # page. So the version is pinned (not `stable`, which drifts with the runner
    # image) and the tests are pointed at the installed binary through
    # `AMATL_BROWSER_BIN`, which `browser_e2e.rs` passes as
    # `goog:chromeOptions.binary`. Chromedriver then drives the same Chrome this
    # job verifies. Bumping the pin is a reviewed change.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Chrome and a matching chromedriver
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: 158.0.8127.36
          install-chromedriver: true
      - name: Start WebDriver
        run: |
          set -euo pipefail
          # Pin the browser the tests launch, and prove the pair the *tests* will
          # use actually matches before spending a run on it. The binary name the
          # action installs is not always `chrome`, so its own output is the
          # source of truth.
          browser_bin="${{ steps.setup-chrome.outputs.chrome-path }}"
          echo "AMATL_BROWSER_BIN=$browser_bin" >> "$GITHUB_ENV"
          browser_major="$( \
            "$browser_bin" --version \
            | grep --only-matching --extended-regexp '[0-9]+' | head -n1 )"
          # The driver is whatever lands on PATH; assert the effective one, not
          # the action's output, because that is what the suite will reach.
          driver_major="$( \
            chromedriver --version \
            | grep --only-matching --extended-regexp '[0-9]+' | head -n1 )"
          echo "Chrome major: $browser_major; ChromeDriver major: $driver_major"
          if [ "$browser_major" != "$driver_major" ]; then
            echo "::error::Chrome ($browser_major) and ChromeDriver ($driver_major) major versions differ; align the chrome-version pin"
            exit 1
          fi
          chromedriver --port=4444 &
          for _ in $(seq 1 30); do
            curl -sf http://localhost:4444/status > /dev/null && exit 0
            sleep 1
          done
          echo "::error::chromedriver did not become ready"
          exit 1
      - name: Drive the UI end to end
        env:
          AMATL_BROWSER_E2E: "1"
          AMATL_WEBDRIVER_URL: http://localhost:4444
        run: cargo test --locked -p amatl-server --test browser_e2e -- --test-threads=1

  trafilatura-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install pinned Trafilatura capability
        run: python3 -m pip install --disable-pip-version-check trafilatura==2.2.0
      - name: Verify the real extractor contract
        env:
          AMATL_TRAFILATURA_INTEGRATION: "1"
        run: cargo test --locked -p amatl-core --test trafilatura_integration
