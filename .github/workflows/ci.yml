name: contract-gate

on:
  push:
  pull_request:
  schedule:
    # Nightly, for the long-running jobs excluded from the per-push gate.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contract-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2.82.0
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.18.7,cargo-cyclonedx@0.5.9
          fallback: none
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo check --workspace --benches --locked
      # `--all-features` so the gate covers exactly what is verified locally.
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # The workspace exposes a large public API that ships to docs.rs; broken
      # intra-doc links would otherwise only surface after publishing.
      - name: Documentation builds without warnings
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked
      # Executable quality gate: the CLI exits non-zero when Ranking v2 stops
      # beating its baseline on the shipped labeled corpus.
      - name: Ranking v2 quality gate
        run: cargo run --locked --quiet -p amatl-cli -- benchmark ranking-v2 --json
      - run: cargo audit
      - run: cargo deny check
      - run: cargo cyclonedx
      - uses: actions/upload-artifact@v6
        with:
          name: amatl-sbom
          retention-days: 14
          path: |
            **/*.cdx.json
            **/*.cdx.xml
          if-no-files-found: error

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked

  cross-platform:
    # Release publishes macOS and Windows archives, so the workspace must keep
    # compiling and passing tests on those hosts on every push, not only at tag
    # time. Linux-only capabilities (Chromium sandbox, Debian packaging) stay
    # out of this job by construction.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  soak:
    # The soak test is `#[ignore]`d because it runs for ~30 s and opens many
    # sockets, which does not belong in the per-push gate. Without a scheduled
    # job it never ran at all.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p amatl-server --test soak -- --ignored --nocapture

  browser-e2e:
    # The UI's behaviour lives in 32 KB of vanilla JavaScript, so it is only
    # observable in a real browser. The tests are inert without
    # AMATL_BROWSER_E2E, which keeps a driver-less checkout green.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Chrome and a matching chromedriver
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-chromedriver: true
      - name: Start WebDriver
        run: |
          set -euo pipefail
          chromedriver --port=4444 &
          for _ in $(seq 1 30); do
            curl -sf http://localhost:4444/status > /dev/null && exit 0
            sleep 1
          done
          echo "::error::chromedriver did not become ready"
          exit 1
      - name: Drive the UI end to end
        env:
          AMATL_BROWSER_E2E: "1"
          AMATL_WEBDRIVER_URL: http://localhost:4444
        run: cargo test --locked -p amatl-server --test browser_e2e -- --test-threads=1

  trafilatura-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install pinned Trafilatura capability
        run: python3 -m pip install --disable-pip-version-check trafilatura==2.2.0
      - name: Verify the real extractor contract
        env:
          AMATL_TRAFILATURA_INTEGRATION: "1"
        run: cargo test --locked -p amatl-core --test trafilatura_integration
