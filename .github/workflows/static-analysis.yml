name: static-analysis

# Mostly advisory, with one blocking gate.
#
# Ruff lint over `tools/` is blocking. `tools/ruff.toml` ignores the deliberate
# one-liner style of the evaluation scripts (E701/E702) and freezes their
# pre-existing findings per file, so only *new* problems fail the job. That
# configuration file records the measured baseline (355 findings on 2026-10-25,
# 313 of them the ignored style rules) and explains how to pay it down.
#
# The remaining steps are advisory because their baselines are not zero yet:
# `ruff format --check` (52 files would be rewritten today) and semgrep, which
# reports style-adjacent noise in a test-rich checkout. They run with
# `continue-on-error: true` and publish a summary instead of failing the job.
#
# ast-grep is deliberately absent: without a project ruleset it can only produce
# the same style noise ruff already reports. It stays a local/agent tool until
# someone writes rules for this codebase.
on:
  push:
    paths:
      - "tools/**"
      - "crates/**"
      - ".github/workflows/static-analysis.yml"
  pull_request:
    paths:
      - "tools/**"
      - "crates/**"
      - ".github/workflows/static-analysis.yml"
  schedule:
    # Weekly drift check: findings can change without a push to those paths.
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-analysis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tools:
    name: Python tools (lint blocking, format advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      # Pinned to the version the baseline above was measured with, so the
      # numbers in the summary are comparable between runs.
      - name: Install Ruff
        run: python3 -m pip install --disable-pip-version-check ruff==0.15.22
      - name: Ruff lint (blocking)
        run: |
          set -euo pipefail
          {
            echo '### Ruff lint (tools/) — blocking'
            echo
            echo "Baseline frozen in \`tools/ruff.toml\`: E701/E702 are ignored by"
            echo "house style, and the pre-existing findings are listed per file in"
            echo "\`per-file-ignores\`. Only new findings fail this step."
            echo
            echo '```'
            ruff check tools/ --statistics --exit-zero
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Last command determines the exit code, so this is the gate. The
          # summary above is already published when it fails.
          ruff check tools/ --output-format=github
      - name: Ruff format check (informative)
        continue-on-error: true
        run: |
          set -euo pipefail
          {
            echo '### Ruff format (tools/)'
            echo
            echo '```'
            ruff format --check tools/ || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  semgrep:
    name: Semgrep (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Install Semgrep
        run: python3 -m pip install --disable-pip-version-check semgrep==1.182.1
      - name: Python tooling
        continue-on-error: true
        run: |
          set -euo pipefail
          semgrep scan --config=p/python --metrics=off --quiet tools/ \
            > semgrep-python.txt 2>&1 || true
          {
            echo '### Semgrep (tools/, p/python)'
            echo
            echo '```'
            tail -n 60 semgrep-python.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Rust crates
        continue-on-error: true
        run: |
          set -euo pipefail
          semgrep scan --config=p/rust --metrics=off --quiet crates/ \
            > semgrep-rust.txt 2>&1 || true
          {
            echo '### Semgrep (crates/, p/rust)'
            echo
            echo '```'
            tail -n 60 semgrep-rust.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        with:
          name: semgrep-reports
          retention-days: 7
          path: semgrep-*.txt
          if-no-files-found: ignore
