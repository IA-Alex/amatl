name: static-analysis

# Mostly advisory, with two blocking gates.
#
# Ruff lint over `tools/` is blocking. `tools/ruff.toml` ignores the deliberate
# one-liner style of the evaluation scripts (E701/E702) and freezes their
# pre-existing findings per file, so only *new* problems fail the job. That
# configuration file records the measured baseline (355 findings on 2026-10-25,
# 313 of them the ignored style rules) and explains how to pay it down.
#
# The documentation-reference check is also blocking and equally narrow:
# `tools/check_doc_refs.py` fails when a `file:line` citation in `docs/` names a
# file that does not exist or a line past the end of that file. It freezes the
# few intentionally-external references (upstream dependency source) and cannot
# see *semantic* drift, so it does not replace re-checking a citation when the
# code it points at moves.
#
# The remaining steps are advisory because their baselines are not zero yet:
# `ruff format --check` (52 of the 54 Python files in `tools/` would be rewritten,
# as of the 2026-10-25 baseline — a number that drifts silently, so re-measure it
# before quoting it) and semgrep, which reports style-adjacent noise in a
# test-rich checkout. They run with `continue-on-error: true` and publish a
# summary instead of failing the job.
#
# ast-grep is deliberately absent: without a project ruleset it can only produce
# the same style noise ruff already reports. It stays a local/agent tool until
# someone writes rules for this codebase.
on:
  push:
    paths:
      - "tools/**"
      - "crates/**"
      - "docs/**"
      - "README.md"
      - "SECURITY.md"
      - ".github/workflows/static-analysis.yml"
  pull_request:
    paths:
      - "tools/**"
      - "crates/**"
      - "docs/**"
      - "README.md"
      - "SECURITY.md"
      - ".github/workflows/static-analysis.yml"
  schedule:
    # Weekly drift check: findings can change without a push to those paths.
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-analysis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tools:
    name: Python tools (lint blocking, format advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      # Pinned to the version the baseline above was measured with, so the
      # numbers in the summary are comparable between runs.
      - name: Install Ruff
        run: python3 -m pip install --disable-pip-version-check ruff==0.15.22
      - name: Ruff lint (blocking)
        run: |
          set -euo pipefail
          {
            echo '### Ruff lint (tools/) — blocking'
            echo
            echo "Baseline frozen in \`tools/ruff.toml\`: E701/E702 are ignored by"
            echo "house style, and the pre-existing findings are listed per file in"
            echo "\`per-file-ignores\`. Only new findings fail this step."
            echo
            echo '```'
            ruff check tools/ --statistics --exit-zero
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Last command determines the exit code, so this is the gate. The
          # summary above is already published when it fails.
          ruff check tools/ --output-format=github
      - name: Ruff format check (informative)
        continue-on-error: true
        run: |
          set -euo pipefail
          {
            echo '### Ruff format (tools/)'
            echo
            echo '```'
            ruff format --check tools/ || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  doc-refs:
    name: Documentation references (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      # Standard library only, so there is nothing to install. The script
      # freezes the intentionally-external references and fails on new ones.
      - name: Every `file:line` citation must resolve
        run: |
          set -euo pipefail
          {
            echo '### Documentation references'
            echo
            echo '```'
            python3 tools/check_doc_refs.py --list || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Last command decides the exit code, so this is the gate.
          python3 tools/check_doc_refs.py

  semgrep:
    name: Semgrep (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Install Semgrep
        run: python3 -m pip install --disable-pip-version-check semgrep==1.182.1
      - name: Python tooling
        continue-on-error: true
        run: |
          set -euo pipefail
          semgrep scan --config=p/python --metrics=off --quiet tools/ \
            > semgrep-python.txt 2>&1 || true
          {
            echo '### Semgrep (tools/, p/python)'
            echo
            echo '```'
            tail -n 60 semgrep-python.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Rust crates
        continue-on-error: true
        run: |
          set -euo pipefail
          semgrep scan --config=p/rust --metrics=off --quiet crates/ \
            > semgrep-rust.txt 2>&1 || true
          {
            echo '### Semgrep (crates/, p/rust)'
            echo
            echo '```'
            tail -n 60 semgrep-rust.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        with:
          name: semgrep-reports
          retention-days: 7
          path: semgrep-*.txt
          if-no-files-found: ignore
